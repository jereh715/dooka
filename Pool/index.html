
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nine Rails — 3D Pool</title>
<style>
  :root{
    --ink:#0b0f0d;
    --felt:#0f5132;
    --felt-dark:#083b24;
    --brass:#c9a35b;
    --brass-dim:#8a713c;
    --cream:#efe6d3;
    --red:#c0392b;
    --panel:rgba(10,14,12,0.72);
    --panel-edge:rgba(201,163,91,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--ink);
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    font-family: 'Georgia', 'Times New Roman', serif;
    color:var(--cream);
  }
  #app{position:fixed; inset:0;}
  canvas{display:block; touch-action:none;}

  .hud{
    position:fixed; left:0; right:0; top:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: max(10px, env(safe-area-inset-top)) 10px 0 10px;
    pointer-events:none;
    z-index:20;
    font-family: 'Trebuchet MS', sans-serif;
  }
  .card{
    pointer-events:auto;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    padding:8px 12px;
    backdrop-filter: blur(6px);
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  .turn-card{min-width:150px}
  .turn-title{
    font-family:'Georgia',serif; letter-spacing:1px; font-size:11px; color:var(--brass);
    text-transform:uppercase; margin-bottom:2px;
  }
  .turn-name{font-size:16px; font-weight:bold; color:var(--cream);}
  .turn-group{font-size:12px; color:#c9c3b0; margin-top:2px;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; border:1px solid rgba(255,255,255,0.4);}

  .rack-card{display:flex; gap:10px; align-items:center;}
  .rack-col{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .rack-label{font-size:10px; letter-spacing:1px; color:var(--brass); text-transform:uppercase;}
  .rack-balls{display:flex; gap:3px; flex-wrap:wrap; max-width:120px;}
  .mini-ball{width:14px; height:14px; border-radius:50%; box-shadow: inset -2px -2px 3px rgba(0,0,0,0.5), inset 1px 1px 2px rgba(255,255,255,0.5);}

  .msg-banner{
    position:fixed; top:78px; left:50%; transform:translateX(-50%);
    pointer-events:none; z-index:25;
    background:var(--panel); border:1px solid var(--panel-edge);
    padding:8px 18px; border-radius:20px; font-size:14px;
    letter-spacing:0.5px; opacity:0; transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  .msg-banner.show{opacity:1;}

  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:space-between; align-items:flex-end; gap:10px;
    padding: 10px 10px max(10px, env(safe-area-inset-bottom)) 10px;
    pointer-events:none; z-index:20;
  }
  .power-wrap{
    pointer-events:none;
    flex:1;
    max-width:280px;
    background:var(--panel); border:1px solid var(--panel-edge);
    border-radius:10px; padding:8px 12px;
  }
  .power-label{font-size:10px; letter-spacing:1px; color:var(--brass); text-transform:uppercase; margin-bottom:5px;}
  .power-track{width:100%; height:10px; background:rgba(255,255,255,0.08); border-radius:6px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);}
  .power-fill{height:100%; width:0%; background:linear-gradient(90deg,#e0c26a,#c0392b); transition:width .05s linear;}

  .btn-col{display:flex; flex-direction:column; gap:8px; pointer-events:auto;}
  .btn{
    background:var(--panel); border:1px solid var(--panel-edge); color:var(--cream);
    font-family:'Trebuchet MS',sans-serif; font-size:12px; letter-spacing:.5px;
    padding:9px 12px; border-radius:8px; cursor:pointer; text-align:center;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{background:rgba(201,163,91,0.25);}
  .btn.primary{border-color:var(--brass); color:var(--brass);}

  #loading{
    position:fixed; inset:0; background:var(--ink); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; transition:opacity .5s ease;
  }
  #loading .title{font-family:Georgia,serif; font-size:26px; letter-spacing:3px; color:var(--brass);}
  #loading .sub{font-size:12px; letter-spacing:2px; color:#8a8272; text-transform:uppercase;}
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(201,163,91,0.25); border-top-color:var(--brass);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  #overlay-screen{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center;
    background:rgba(5,8,7,0.82); backdrop-filter:blur(4px);
  }
  #overlay-screen .box{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:14px;
    padding:26px 30px; text-align:center; max-width:320px;
  }
  #overlay-screen h2{margin:0 0 6px 0; color:var(--brass); font-size:22px; letter-spacing:1px;}
  #overlay-screen p{margin:0 0 16px 0; font-size:13px; color:#cfc9b8; line-height:1.5;}

  .hint{
    position:fixed; z-index:15; bottom:96px; left:50%; transform:translateX(-50%);
    font-size:11px; color:#a89f8a; letter-spacing:.5px; pointer-events:none;
    background:rgba(0,0,0,0.35); padding:5px 10px; border-radius:8px;
    opacity:0.9; transition:opacity .4s ease;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="title">NINE RAILS</div>
  <div class="spinner"></div>
  <div class="sub">Setting up the table…</div>
</div>

<div class="hud">
  <div class="card turn-card">
    <div class="turn-title">Now shooting</div>
    <div class="turn-name" id="turnName">Player 1</div>
    <div class="turn-group" id="turnGroup">Open table</div>
  </div>
  <div class="card rack-card">
    <div class="rack-col">
      <div class="rack-label" id="p1Label">P1</div>
      <div class="rack-balls" id="p1Balls"></div>
    </div>
    <div class="rack-col">
      <div class="rack-label" id="p2Label">P2</div>
      <div class="rack-balls" id="p2Balls"></div>
    </div>
  </div>
</div>

<div class="msg-banner" id="msgBanner"></div>
<div class="hint" id="hintText">Drag away from the cue ball to aim &amp; set power. Release to shoot. Two fingers to orbit / pinch to zoom.</div>

<div class="bottom-bar">
  <div class="power-wrap">
    <div class="power-label">Power</div>
    <div class="power-track"><div class="power-fill" id="powerFill"></div></div>
  </div>
  <div class="btn-col">
    <div class="btn primary" id="btnNewGame">New Game</div>
    <div class="btn" id="btnCam">Reset View</div>
  </div>
</div>

<div id="overlay-screen">
  <div class="box">
    <h2 id="overlayTitle">Game Over</h2>
    <p id="overlayText">Player 1 wins!</p>
    <div class="btn primary" id="overlayBtn" style="pointer-events:auto;">Rack Again</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* =========================================================================
   NINE RAILS — a self-contained 3D 8-ball pool game built on three.js
   Single file: markup, styling and logic all live in index.html.
   ========================================================================= */

/* ---------------------------- CONSTANTS -------------------------------- */

const TABLE_W = 2.24;          // playable width  (x)
const TABLE_L = 4.48;          // playable length (z)
const CUSHION_H = 0.10;
const BALL_R = 0.0615;
const BALL_MASS = 1;
const POCKET_R = 0.118;
const FRICTION = 0.62;          // rolling friction decel (m/s^2 approx scaled)
const SPIN_DAMP = 0.985;
const WALL_RESTITUTION = 0.82;
const BALL_RESTITUTION = 0.96;
const MAX_SHOT_SPEED = 8.2;
const MIN_SHOT_SPEED = 0.35;
const STOP_EPS = 0.012;
const TABLE_Y = 0.82;           // height of table surface (world y)
const BALL_Y = TABLE_Y + BALL_R;

const POCKETS = [
  {x:-TABLE_W/2, z:-TABLE_L/2}, {x:0, z:-TABLE_L/2 - 0.02}, {x:TABLE_W/2, z:-TABLE_L/2},
  {x:-TABLE_W/2, z: TABLE_L/2}, {x:0, z: TABLE_L/2 + 0.02}, {x:TABLE_W/2, z: TABLE_L/2}
];

const BALL_COLORS = {
  1:{c:0xcaa11a, stripe:false}, 2:{c:0x1c4fa0, stripe:false}, 3:{c:0xb42121, stripe:false},
  4:{c:0x5b2d8e, stripe:false}, 5:{c:0xd8681c, stripe:false}, 6:{c:0x1c6b3a, stripe:false},
  7:{c:0x6e1f22, stripe:false}, 8:{c:0x141414, stripe:false},
  9:{c:0xcaa11a, stripe:true}, 10:{c:0x1c4fa0, stripe:true}, 11:{c:0xb42121, stripe:true},
  12:{c:0x5b2d8e, stripe:true}, 13:{c:0xd8681c, stripe:true}, 14:{c:0x1c6b3a, stripe:true},
  15:{c:0x6e1f22, stripe:true}
};

/* ---------------------------- DOM REFS ---------------------------------- */

const $ = (id)=>document.getElementById(id);
const turnNameEl = $('turnName'), turnGroupEl = $('turnGroup');
const p1BallsEl = $('p1Balls'), p2BallsEl = $('p2Balls');
const p1LabelEl = $('p1Label'), p2LabelEl = $('p2Label');
const powerFillEl = $('powerFill');
const msgBannerEl = $('msgBanner');
const overlayScreen = $('overlay-screen'), overlayTitle = $('overlayTitle'),
      overlayText = $('overlayText'), overlayBtn = $('overlayBtn');
const loadingEl = $('loading');
const hintEl = $('hintText');

let msgTimer = null;
function showMessage(text, duration){
  msgBannerEl.textContent = text;
  msgBannerEl.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=>msgBannerEl.classList.remove('show'), duration||2200);
}

/* ---------------------------- AUDIO -------------------------------------- */

let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function pluck(freq, dur, vol, type){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur);
}
function sfxClick(strength){ pluck(320+strength*260, 0.09, Math.min(0.22, 0.05+strength*0.18), 'triangle'); }
function sfxCushion(strength){ pluck(160+strength*80, 0.12, Math.min(0.16,0.04+strength*0.1), 'sine'); }
function sfxPocket(){ pluck(180,0.18,0.18,'sine'); setTimeout(()=>pluck(120,0.22,0.14,'sine'),70); }
function sfxFoul(){ pluck(140,0.35,0.15,'sawtooth'); }
function sfxWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>pluck(f,0.3,0.15,'triangle'), i*110)); }

/* ---------------------------- THREE.JS SETUP ----------------------------- */

const isMobile = /Android|iPhone|iPad|iPod|Mobi|webOS|BlackBerry|IEMobile/i.test(navigator.userAgent)
  || (window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
const MAX_PIXEL_RATIO = isMobile ? 1.5 : 2;
const BALL_SEG = isMobile ? 16 : 26;         // sphere subdivisions per ball
const TEX_SIZE = isMobile ? {w:256,h:128} : {w:512,h:256};
const SHADOW_MAP_SIZE = isMobile ? 512 : 1024;

const container = $('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f0d);
scene.fog = new THREE.Fog(0x0b0f0d, 6, 14);

// Orthographic (true isometric-style) camera — no perspective convergence,
// keeps the whole table readable at a glance and is a bit cheaper to project too.
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 40);

const renderer = new THREE.WebGLRenderer({antialias: !isMobile, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, MAX_PIXEL_RATIO));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = isMobile ? THREE.BasicShadowMap : THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // only static rails/frame cast real shadows — refreshed manually once
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

/* Lighting — kept to a minimal set of lights since every extra light adds a
   per-fragment cost that adds up fast on mobile GPUs. */
const ambient = new THREE.AmbientLight(0x8890a0, 0.65);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x1a1410, 0.5);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff2d8, 0.95);
keyLight.position.set(1.6, 4.2, 1.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(SHADOW_MAP_SIZE, SHADOW_MAP_SIZE);
keyLight.shadow.camera.left = -3; keyLight.shadow.camera.right = 3;
keyLight.shadow.camera.top = 3.5; keyLight.shadow.camera.bottom = -3.5;
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 9;
keyLight.shadow.bias = -0.0015;
scene.add(keyLight);

/* Overhead lamp visuals — purely decorative meshes, no extra scene lights */
function makeLamp(x,z){
  const g = new THREE.Group();
  const shade = new THREE.Mesh(
    new THREE.CylinderGeometry(0.34, 0.42, 0.16, isMobile?10:20, 1, true),
    new THREE.MeshLambertMaterial({color:0x1a1410, side:THREE.DoubleSide})
  );
  shade.position.set(x, 2.55, z);
  g.add(shade);
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, isMobile?8:12, isMobile?6:12),
    new THREE.MeshBasicMaterial({color:0xfff3d0})
  );
  bulb.position.set(x,2.46,z);
  g.add(bulb);
  return g;
}
scene.add(makeLamp(0,-1.05));
scene.add(makeLamp(0, 1.05));

/* ---------------------------- TABLE GEOMETRY ------------------------------ */

const RAIL_W = 0.18;
const tableGroup = new THREE.Group();
scene.add(tableGroup);

/* Felt */
const feltMat = new THREE.MeshLambertMaterial({color:0x0f5c38});
const feltGeo = new THREE.PlaneGeometry(TABLE_W, TABLE_L, isMobile?1:8, isMobile?1:16);
const felt = new THREE.Mesh(feltGeo, feltMat);
felt.rotation.x = -Math.PI/2;
felt.position.y = TABLE_Y;
felt.receiveShadow = true;
tableGroup.add(felt);

/* subtle felt diamonds markers, sitting just above the cushion tops so they
   don't z-fight with (or get buried under) the rail geometry */
const diamondMat = new THREE.MeshLambertMaterial({color:0xe8dcb8});
const diamondY = TABLE_Y + CUSHION_H + 0.004;
function addDiamond(x,z){
  const d = new THREE.Mesh(new THREE.CircleGeometry(0.02,4), diamondMat);
  d.rotation.x = -Math.PI/2;
  d.position.set(x, diamondY, z);
  tableGroup.add(d);
}
for(let i=-3;i<=3;i++){ if(i===0) continue; addDiamond(i*TABLE_W/7*1.05, -TABLE_L/2 - RAIL_W*0.55); addDiamond(i*TABLE_W/7*1.05, TABLE_L/2 + RAIL_W*0.55); }
for(let i=-6;i<=6;i++){ if(i===0) continue; addDiamond(TABLE_W/2 + RAIL_W*0.55, i*TABLE_L/14*1.05); addDiamond(-TABLE_W/2 - RAIL_W*0.55, i*TABLE_L/14*1.05); }

/* Cushions (4 rails made of boxes with pocket gaps).
   Sunk very slightly below the felt's top so their bottom face never sits
   exactly coplanar with the felt plane — coplanar meshes are what caused the
   green/brown flicker on mobile GPUs with lower depth-buffer precision. */
const cushionMat = new THREE.MeshLambertMaterial({color:0x0c4429});
function makeCushionBox(w,h,d,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), cushionMat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  tableGroup.add(m);
  return m;
}
const Z_FIGHT_GUARD = 0.006;
const cushY = TABLE_Y + CUSHION_H/2 - Z_FIGHT_GUARD;
// long rails (x sides) split top/bottom for middle pocket gap
const gap = POCKET_R*1.5;
makeCushionBox(RAIL_W, CUSHION_H, TABLE_L/2 - gap - POCKET_R*0.6, -TABLE_W/2 - RAIL_W/2 + 0.02, cushY, -(TABLE_L/4 + gap/4));
makeCushionBox(RAIL_W, CUSHION_H, TABLE_L/2 - gap - POCKET_R*0.6, -TABLE_W/2 - RAIL_W/2 + 0.02, cushY, (TABLE_L/4 + gap/4));
makeCushionBox(RAIL_W, CUSHION_H, TABLE_L/2 - gap - POCKET_R*0.6,  TABLE_W/2 + RAIL_W/2 - 0.02, cushY, -(TABLE_L/4 + gap/4));
makeCushionBox(RAIL_W, CUSHION_H, TABLE_L/2 - gap - POCKET_R*0.6,  TABLE_W/2 + RAIL_W/2 - 0.02, cushY, (TABLE_L/4 + gap/4));
// short rails (z sides)
makeCushionBox(TABLE_W - POCKET_R*2.4, CUSHION_H, RAIL_W, 0, cushY, -TABLE_L/2 - RAIL_W/2 + 0.02);
makeCushionBox(TABLE_W - POCKET_R*2.4, CUSHION_H, RAIL_W, 0, cushY,  TABLE_L/2 + RAIL_W/2 - 0.02);

/* Wooden outer frame — shifted down by Z_FIGHT_GUARD so its top face sits
   strictly below the felt plane instead of exactly on top of it. */
const woodMat = new THREE.MeshLambertMaterial({color:0x3b2415});
const frameOuterW = TABLE_W + RAIL_W*2 + 0.16;
const frameOuterL = TABLE_L + RAIL_W*2 + 0.16;
const frameY = TABLE_Y - 0.11 - Z_FIGHT_GUARD;
const frame = new THREE.Mesh(new THREE.BoxGeometry(frameOuterW, 0.22, frameOuterL), woodMat);
frame.position.set(0, frameY, 0);
frame.castShadow = true; frame.receiveShadow = true;
tableGroup.add(frame);
// brass corner trim accents (visual only, few enough to keep as a nicer material)
const brassMat = new THREE.MeshStandardMaterial({color:0xc9a35b, metalness:0.7, roughness:0.35});
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
  const trim = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.24,isMobile?6:10), brassMat);
  trim.position.set(sx*(frameOuterW/2-0.05), frameY, sz*(frameOuterL/2-0.05));
  tableGroup.add(trim);
});

/* Legs */
const legGeo = new THREE.CylinderGeometry(0.06,0.08,0.78,isMobile?6:10);
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
  const leg = new THREE.Mesh(legGeo, woodMat);
  leg.position.set(sx*(frameOuterW/2-0.16), frameY-0.39, sz*(frameOuterL/2-0.32));
  leg.castShadow = true;
  tableGroup.add(leg);
});

/* Floor */
const floorMat = new THREE.MeshLambertMaterial({color:0x161210});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30,30), floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.y = frameY - 0.9;
floor.receiveShadow = true;
scene.add(floor);

/* Pockets (visual dark holes + rim) — comfortably separated in y from the
   felt plane to avoid any depth-precision flicker on mobile screens. */
const pocketMat = new THREE.MeshBasicMaterial({color:0x040404});
const pocketRimMat = new THREE.MeshLambertMaterial({color:0x1c1108});
POCKETS.forEach(p=>{
  const hole = new THREE.Mesh(new THREE.CircleGeometry(POCKET_R, isMobile?14:24), pocketMat);
  hole.rotation.x = -Math.PI/2;
  hole.position.set(p.x, TABLE_Y+0.006, p.z);
  tableGroup.add(hole);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(POCKET_R, 0.014, isMobile?6:8, isMobile?14:24), pocketRimMat);
  rim.rotation.x = -Math.PI/2;
  rim.position.set(p.x, TABLE_Y+0.010, p.z);
  tableGroup.add(rim);
});

/* ---------------------------- BALL TEXTURES ------------------------------- */

function makeBallTexture(num, colorHex, stripe){
  const w=512,h=256;
  const cnv = document.createElement('canvas'); cnv.width=w; cnv.height=h;
  const ctx = cnv.getContext('2d');
  const colorStr = '#' + colorHex.toString(16).padStart(6,'0');

  if(num===0){ // cue ball
    ctx.fillStyle = '#f5f0e0';
    ctx.fillRect(0,0,w,h);
  } else if(!stripe){
    ctx.fillStyle = colorStr;
    ctx.fillRect(0,0,w,h);
  } else {
    ctx.fillStyle = '#f5f0e0';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = colorStr;
    ctx.fillRect(0, h*0.24, w, h*0.52);
  }

  if(num>0){
    // number disc at front-center (equator, front-facing longitude)
    const cx = w*0.25, cy = h*0.5, r = h*0.19;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle = '#f5f0e0';
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.stroke();
    ctx.fillStyle = '#151515';
    ctx.font = 'bold ' + Math.floor(r*1.15) + 'px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(num), cx, cy+2);

    // duplicate on the opposite side so the number reads from more angles
    const cx2 = w*0.75;
    ctx.beginPath(); ctx.arc(cx2,cy,r,0,Math.PI*2);
    ctx.fillStyle = '#f5f0e0'; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.stroke();
    ctx.fillStyle = '#151515';
    ctx.fillText(String(num), cx2, cy+2);
  }

  // subtle vertical shading for sheen
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(255,255,255,0.10)');
  grad.addColorStop(0.5,'rgba(255,255,255,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.12)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

  const tex = new THREE.CanvasTexture(cnv);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 4;
  return tex;
}

/* ---------------------------- BALL CLASS ---------------------------------- */

const ballGeo = new THREE.SphereGeometry(BALL_R, 32, 32);
const balls = [];       // active Ball objects (index 0 = cue)
let cueBall = null;

class Ball{
  constructor(num){
    this.num = num;
    this.isCue = num===0;
    this.isEight = num===8;
    this.group = num===0 ? 'cue' : (num<=7 ? 'solid' : (num===8 ? 'eight' : 'stripe'));
    const info = num===0 ? {c:0xffffff, stripe:false} : BALL_COLORS[num];
    const tex = makeBallTexture(num, info.c, info.stripe);
    const mat = new THREE.MeshStandardMaterial({map:tex, roughness:0.28, metalness:0.05});
    this.mesh = new THREE.Mesh(ballGeo, mat);
    this.mesh.castShadow = true;
    this.mesh.receiveShadow = true;
    tableGroup.add(this.mesh);
    this.pos = new THREE.Vector3();
    this.vel = new THREE.Vector3();
    this.angVel = new THREE.Vector3();
    this.active = true;
    this.pocketed = false;
    this.colorHex = info.c;
  }
  setXZ(x,z){ this.pos.set(x, BALL_Y, z); this.mesh.position.copy(this.pos); }
  syncMesh(){ this.mesh.position.copy(this.pos); }
  remove(){
    this.active = false;
    tableGroup.remove(this.mesh);
  }
}

/* Standard triangular rack (apex toward the head/cue side, i.e. -z direction from foot spot) */
function rackPositions(){
  const spot = TABLE_L*0.22; // foot spot distance from center
  const rows = [
    [1],
    [9,2],
    [3,8,10],
    [11,4,15],
    [5,12,6]
  ];
  // order numbers with 8-ball fixed center of row 3, alternate solids/stripes elsewhere, corners random-ish but valid
  const order = [1, 9,2, 10,8,11, 3,15,4,6, 5,13,7,12,14];
  let idx=0;
  const positions = [];
  const dz = BALL_R*Math.sqrt(3);
  for(let row=0; row<5; row++){
    const count = row+1;
    for(let i=0;i<count;i++){
      const x = (i - (count-1)/2) * (BALL_R*2.02);
      const z = spot + row*dz*1.02;
      positions.push({x,z,num:order[idx++]});
    }
  }
  return positions;
}

function clearBalls(){
  balls.forEach(b=>b.remove());
  balls.length = 0;
}

function rackBalls(){
  clearBalls();
  const cue = new Ball(0);
  cue.setXZ(0, -TABLE_L*0.25);
  balls.push(cue);
  cueBall = cue;

  rackPositions().forEach(p=>{
    const b = new Ball(p.num);
    b.setXZ(p.x, p.z);
    balls.push(b);
  });
}

const camState = {
  azimuth: Math.PI, // radians, angle around table (0 = +z looking toward -z)
  polar: 0.95,       // elevation angle
  radius: 2.55,
  target: new THREE.Vector3(0,TABLE_Y,0)
};
function updateCameraFromState(){
  const {azimuth, polar, radius, target} = camState;
  const x = target.x + radius*Math.sin(polar)*Math.sin(azimuth);
  const y = target.y + radius*Math.cos(polar);
  const z = target.z + radius*Math.sin(polar)*Math.cos(azimuth);
  camera.position.set(x,y,z);
  camera.lookAt(target.x, target.y+0.05, target.z);
}
function resetCamera(){
  camState.azimuth = Math.PI;
  camState.polar = 0.95;
  camState.radius = 2.55;
  updateCameraFromState();
}

/* ---------------------------- PHYSICS --------------------------------------- */

const PLAY_MIN_X = -TABLE_W/2 + BALL_R + 0.006;
const PLAY_MAX_X =  TABLE_W/2 - BALL_R - 0.006;
const PLAY_MIN_Z = -TABLE_L/2 + BALL_R + 0.006;
const PLAY_MAX_Z =  TABLE_L/2 - BALL_R - 0.006;

function anyBallMoving(){
  for(const b of balls){
    if(!b.active || b.pocketed) continue;
    if(b.vel.lengthSq() > STOP_EPS*STOP_EPS) return true;
  }
  return false;
}

function nearPocket(x,z){
  for(const p of POCKETS){
    const dx=x-p.x, dz=z-p.z;
    if(dx*dx+dz*dz < POCKET_R*POCKET_R) return p;
  }
  return null;
}

let pendingPockets = [];
let pendingFirstHit = null;

function stepPhysics(dt){
  // integrate
  for(const b of balls){
    if(!b.active || b.pocketed) continue;
    if(b.vel.lengthSq() < 1e-7){ b.vel.set(0,0,0); continue; }
    b.pos.x += b.vel.x*dt;
    b.pos.z += b.vel.z*dt;

    // friction deceleration
    const speed = b.vel.length();
    const drop = FRICTION*dt*2.0;
    const newSpeed = Math.max(0, speed-drop);
    if(speed>0){ b.vel.multiplyScalar(newSpeed/speed); }

    // pocket check (only if within playfield radius roughly, or beyond rail near pocket zone)
    const pk = nearPocket(b.pos.x, b.pos.z);
    if(pk){
      pendingPockets.push(b);
      continue;
    }

    // cushion collisions
    if(b.pos.x < PLAY_MIN_X){ b.pos.x = PLAY_MIN_X; if(b.vel.x<0){ b.vel.x*=-WALL_RESTITUTION; sfxCushion(Math.min(1,Math.abs(b.vel.x))); } }
    if(b.pos.x > PLAY_MAX_X){ b.pos.x = PLAY_MAX_X; if(b.vel.x>0){ b.vel.x*=-WALL_RESTITUTION; sfxCushion(Math.min(1,Math.abs(b.vel.x))); } }
    if(b.pos.z < PLAY_MIN_Z){ b.pos.z = PLAY_MIN_Z; if(b.vel.z<0){ b.vel.z*=-WALL_RESTITUTION; sfxCushion(Math.min(1,Math.abs(b.vel.z))); } }
    if(b.pos.z > PLAY_MAX_Z){ b.pos.z = PLAY_MAX_Z; if(b.vel.z>0){ b.vel.z*=-WALL_RESTITUTION; sfxCushion(Math.min(1,Math.abs(b.vel.z))); } }
  }

  // ball-ball collisions
  for(let i=0;i<balls.length;i++){
    const a = balls[i];
    if(!a.active||a.pocketed) continue;
    for(let j=i+1;j<balls.length;j++){
      const b = balls[j];
      if(!b.active||b.pocketed) continue;
      const dx = b.pos.x-a.pos.x, dz = b.pos.z-a.pos.z;
      const distSq = dx*dx+dz*dz;
      const minDist = BALL_R*2;
      if(distSq < minDist*minDist && distSq>1e-9){
        const dist = Math.sqrt(distSq);
        const nx = dx/dist, nz = dz/dist;
        // separate
        const overlap = (minDist-dist)/2;
        a.pos.x -= nx*overlap; a.pos.z -= nz*overlap;
        b.pos.x += nx*overlap; b.pos.z += nz*overlap;
        // relative velocity along normal
        const rvx = b.vel.x-a.vel.x, rvz = b.vel.z-a.vel.z;
        const velAlongNormal = rvx*nx+rvz*nz;
        if(velAlongNormal < 0){
          const restitution = BALL_RESTITUTION;
          const impulse = -(1+restitution)*velAlongNormal/2;
          a.vel.x -= impulse*nx; a.vel.z -= impulse*nz;
          b.vel.x += impulse*nx; b.vel.z += impulse*nz;
          const strength = Math.min(1, Math.abs(velAlongNormal)/4);
          sfxClick(strength);
          // register first-hit for cue ball
          if(a.isCue && pendingFirstHit===null){ pendingFirstHit = b.num; }
          if(b.isCue && pendingFirstHit===null){ pendingFirstHit = a.num; }
        }
      }
    }
  }

  // rolling visual: rotate balls based on velocity (approx rolling without slipping)
  for(const b of balls){
    if(!b.active||b.pocketed) continue;
    const v = b.vel;
    const speed = v.length();
    if(speed>0.001){
      const axis = new THREE.Vector3(-v.z, 0, v.x).normalize();
      const angle = speed*dt/BALL_R;
      b.mesh.rotateOnWorldAxis(axis, angle);
    }
    b.syncMesh();
  }
}

let fallingCount = 0;

function handlePocketsAndSettle(){
  if(pendingPockets.length){
    pendingPockets.forEach(b=>{
      if(b.pocketed) return;
      b.pocketed = true;
      b.vel.set(0,0,0);
      sfxPocket();
      fallingCount++;
      animatePocketFall(b);
    });
    pendingPockets = [];
  }
}

function animatePocketFall(b){
  const startY = b.pos.y;
  let t=0;
  const dur = 0.35;
  function step(){
    t += 1/60;
    const p = Math.min(1, t/dur);
    b.mesh.position.y = startY - p*0.35;
    b.mesh.scale.setScalar(1-p*0.85);
    if(p<1){ requestAnimationFrame(step); }
    else { b.remove(); onBallFullyPocketed(b); fallingCount--; }
  }
  step();
}

/* ---------------------------- TURN RESOLUTION -------------------------------- */

let shotInProgress = false;
let turnPocketedNums = [];
let turnFirstHit = null;
let cueWasPocketed = false;
let eightPocketed = false;
let eightPocketedLegally = true;

function onBallFullyPocketed(b){
  if(b.isCue){ cueWasPocketed = true; return; }
  if(b.isEight){ eightPocketed = true; }
  turnPocketedNums.push(b.num);
}

function startShotTracking(){
  shotInProgress = true;
  turnPocketedNums = [];
  pendingFirstHit = null;
  turnFirstHit = null;
  cueWasPocketed = false;
  eightPocketed = false;
}

function resolveTurn(){
  shotInProgress = false;
  turnFirstHit = pendingFirstHit;

  if(turnPocketedNums.length){
    turnPocketedNums.forEach(n=>{
      if(n>=1&&n<=7) Game.pottedSolids.add(n);
      else if(n>=9&&n<=15) Game.pottedStripes.add(n);
    });
  }

  const current = Game.turn;
  let foul = false;
  let foulReason = '';
  let switchTurn = false;
  let potOwnBall = false;

  // determine group assignment on first legal contact after open table
  if(Game.openTable && turnFirstHit && !eightPocketed){
    // if player pocketed a numbered ball this turn, assign group based on that ball
    const potNonEight = turnPocketedNums.filter(n=>n!==8);
    if(potNonEight.length){
      const grp = potNonEight[0]<=7 ? 'solid':'stripe';
      Game.groups[current] = grp;
      Game.groups[otherPlayer(current)] = grp==='solid' ? 'stripe':'solid';
      Game.openTable = false;
    }
  }

  const myGroup = Game.groups[current];

  // foul: no ball hit at all
  if(!turnFirstHit && !cueWasPocketed){
    foul = true; foulReason = 'No ball hit — foul.';
  }
  // foul: hit opponent ball first (only matters once groups assigned)
  else if(!Game.openTable && myGroup){
    const hitGroup = turnFirstHit===8 ? 'eight' : (turnFirstHit<=7?'solid':'stripe');
    const myRemaining = myGroup==='solid' ? (7-Game.pottedSolids.size) : (7-Game.pottedStripes.size);
    if(hitGroup==='eight' && myRemaining>0){
      foul = true; foulReason = 'Hit the 8-ball early — foul.';
    } else if(hitGroup!=='eight' && hitGroup!==myGroup){
      foul = true; foulReason = "Hit opponent's ball first — foul.";
    }
  }

  // scratch
  if(cueWasPocketed){
    foul = true; foulReason = foulReason || 'Scratch — cue ball pocketed.';
  }

  // 8-ball outcome
  if(eightPocketed){
    const myRemaining = myGroup ? (myGroup==='solid' ? (7-Game.pottedSolids.size) : (7-Game.pottedStripes.size)) : 99;
    if(myGroup && myRemaining<=0 && !cueWasPocketed && !foul){
      // legal win
      endGame(current, false);
      return;
    } else {
      // illegal 8-ball pocket -> lose
      endGame(otherPlayer(current), true);
      return;
    }
  }

  // did the current player pocket one of their own group's balls (legally, no foul)?
  if(!foul){
    const potOwn = turnPocketedNums.some(n=>{
      if(!myGroup) return true; // open table, any numbered ball (not 8) counts as continuing turn
      return myGroup==='solid' ? (n<=7) : (n>=9);
    });
    potOwnBall = potOwn && turnPocketedNums.length>0;
  }

  if(foul){
    showMessage(foulReason + ' Ball in hand for ' + Game.names[otherPlayer(current)] + '.', 3000);
    sfxFoul();
    switchTurn = true;
    Game.ballInHand = true;
  } else if(potOwnBall){
    showMessage('Nice shot — shoot again.', 1800);
    switchTurn = false;
  } else {
    switchTurn = true;
  }

  // respawn cue ball if scratched
  if(cueWasPocketed){
    respawnCueBall();
  }

  if(switchTurn){
    Game.turn = otherPlayer(current);
  }
  refreshHud();
}

function respawnCueBall(){
  cueBall.active = true;
  cueBall.pocketed = false;
  cueBall.vel.set(0,0,0);
  cueBall.mesh.scale.setScalar(1);
  cueBall.setXZ(0, -TABLE_L*0.25);
  if(!balls.includes(cueBall)) balls.push(cueBall);
  tableGroup.add(cueBall.mesh);
}

function endGame(winner, byFoul){
  Game.gameOver = true;
  sfxWin();
  overlayTitle.textContent = 'Game Over';
  overlayText.textContent = Game.names[winner] + ' wins' + (byFoul? ' — opponent pocketed the 8-ball illegally!' : ' by legally sinking the 8-ball!');
  overlayScreen.style.display = 'flex';
  refreshHud();
}

/* ---------------------------- INPUT / AIMING ---------------------------------- */

const raycaster = new THREE.Raycaster();
const tablePlane = new THREE.Plane(new THREE.Vector3(0,1,0), -BALL_Y);
const pointerNDC = new THREE.Vector2();

const touches = new Map(); // pointerId -> {x,y}
let aimTouchId = null;
let aimStartWorld = null;
let aimAngle = 0;
let aimPower = 0;
let isAiming = false;
let placingCue = false;

// two-finger orbit state
let orbitPrev = null;
let pinchPrevDist = null;

function screenToWorldOnTable(clientX, clientY){
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((clientX-rect.left)/rect.width)*2-1;
  pointerNDC.y = -((clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointerNDC, camera);
  const pt = new THREE.Vector3();
  raycaster.ray.intersectPlane(tablePlane, pt);
  return pt;
}

function canShoot(){
  return !Game.gameOver && !shotInProgress && Game.balls_state==='idle' && !anyBallMoving();
}

function beginAim(worldPt){
  isAiming = true;
  aimLine.visible = true;
  ghostRing.visible = false;
  cueGroup.visible = true;
  updateAim(worldPt);
}

function updateAim(worldPt){
  const cp = cueBall.pos;
  const dx = cp.x - worldPt.x;
  const dz = cp.z - worldPt.z;
  const dist = Math.sqrt(dx*dx+dz*dz);
  aimAngle = Math.atan2(dx,dz); // direction ball will travel
  aimPower = Math.max(0, Math.min(1, (dist-0.06)/0.62));

  // update cue stick transform: positioned behind ball opposite of travel dir, pulled back with power
  const dirX = Math.sin(aimAngle), dirZ = Math.cos(aimAngle);
  const pullBack = 0.10 + aimPower*0.34;
  cueGroup.position.set(cp.x - dirX*pullBack, BALL_Y, cp.z - dirZ*pullBack);
  cueGroup.rotation.y = Math.atan2(dirX, dirZ);

  // aim guide line from cue ball forward in shot direction
  const lineLen = 0.9;
  const pts = [
    new THREE.Vector3(cp.x, BALL_Y, cp.z),
    new THREE.Vector3(cp.x + dirX*lineLen, BALL_Y, cp.z + dirZ*lineLen)
  ];
  aimLine.geometry.setFromPoints(pts);
  aimLine.geometry.computeBoundingSphere();
  aimLine.computeLineDistances();

  powerFillEl.style.width = (aimPower*100).toFixed(0)+'%';
}

function releaseAim(){
  isAiming = false;
  aimLine.visible = false;
  cueGroup.visible = false;
  powerFillEl.style.width = '0%';

  if(aimPower > 0.06 && canShoot()){
    ensureAudio();
    const dirX = Math.sin(aimAngle), dirZ = Math.cos(aimAngle);
    const speed = MIN_SHOT_SPEED + aimPower*(MAX_SHOT_SPEED-MIN_SHOT_SPEED);
    cueBall.vel.set(dirX*speed, 0, dirZ*speed);
    startShotTracking();
    Game.balls_state = 'moving';
    hintEl.style.opacity = '0';
  }
  aimPower = 0;
}

function distTouches(){
  const arr = Array.from(touches.values());
  if(arr.length<2) return 0;
  const dx = arr[0].x-arr[1].x, dy = arr[0].y-arr[1].y;
  return Math.sqrt(dx*dx+dy*dy);
}
function midTouches(){
  const arr = Array.from(touches.values());
  return {x:(arr[0].x+arr[1].x)/2, y:(arr[0].y+arr[1].y)/2};
}

function onPointerDown(e){
  ensureAudio();
  touches.set(e.pointerId, {x:e.clientX,y:e.clientY});
  renderer.domElement.setPointerCapture && renderer.domElement.setPointerCapture(e.pointerId);

  if(touches.size===1){
    if(Game.ballInHand){
      placingCue = true;
      return;
    }
    if(!canShoot()) return;
    aimTouchId = e.pointerId;
    const wp = screenToWorldOnTable(e.clientX, e.clientY);
    beginAim(wp);
  } else if(touches.size===2){
    // switch to orbit mode; cancel aim
    if(isAiming){ isAiming=false; aimLine.visible=false; cueGroup.visible=false; powerFillEl.style.width='0%'; aimPower=0; }
    orbitPrev = midTouches();
    pinchPrevDist = distTouches();
  }
}

function onPointerMove(e){
  if(!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, {x:e.clientX,y:e.clientY});

  if(placingCue && touches.size===1){
    const wp = screenToWorldOnTable(e.clientX, e.clientY);
    const cx = Math.max(PLAY_MIN_X, Math.min(PLAY_MAX_X, wp.x));
    const cz = Math.max(PLAY_MIN_Z, Math.min(PLAY_MAX_Z, wp.z));
    cueBall.setXZ(cx,cz);
    return;
  }

  if(touches.size===1 && isAiming && e.pointerId===aimTouchId){
    const wp = screenToWorldOnTable(e.clientX, e.clientY);
    updateAim(wp);
  } else if(touches.size===2){
    const mid = midTouches();
    const dist = distTouches();
    if(orbitPrev){
      const dx = mid.x-orbitPrev.x, dy = mid.y-orbitPrev.y;
      camState.azimuth -= dx*0.006;
      camState.polar = Math.max(0.35, Math.min(1.35, camState.polar - dy*0.004));
      updateCameraFromState();
    }
    if(pinchPrevDist){
      const scale = pinchPrevDist/Math.max(1,dist);
      camState.radius = Math.max(1.1, Math.min(4.5, camState.radius*scale));
      updateCameraFromState();
    }
    orbitPrev = mid; pinchPrevDist = dist;
  }
}

function onPointerUp(e){
  touches.delete(e.pointerId);

  if(placingCue && touches.size===0){
    // check not overlapping other balls
    let bad = false;
    for(const b of balls){ if(b===cueBall||!b.active) continue; const dx=b.pos.x-cueBall.pos.x, dz=b.pos.z-cueBall.pos.z; if(dx*dx+dz*dz < (BALL_R*2.05)*(BALL_R*2.05)) bad=true; }
    if(!bad){ placingCue=false; Game.ballInHand=false; showMessage('Cue ball placed. Take your shot.',1800); }
    else { showMessage("Can't place there — try again.",1500); }
    return;
  }

  if(e.pointerId===aimTouchId && isAiming){
    aimTouchId = null;
    releaseAim();
  }
  if(touches.size<2){ orbitPrev=null; pinchPrevDist=null; }
  if(touches.size===0){ aimTouchId=null; }
}

const dom = renderer.domElement;
dom.style.touchAction = 'none';
dom.addEventListener('pointerdown', onPointerDown, {passive:true});
dom.addEventListener('pointermove', onPointerMove, {passive:true});
window.addEventListener('pointerup', onPointerUp, {passive:true});
window.addEventListener('pointercancel', onPointerUp, {passive:true});

/* ---------------------------- BUTTONS ---------------------------------------- */

$('btnNewGame').addEventListener('click', ()=>{ ensureAudio(); newGame(); });
$('btnCam').addEventListener('click', ()=>{ resetCamera(); });
overlayBtn.addEventListener('click', ()=>{ ensureAudio(); newGame(); });

/* ---------------------------- RESIZE ------------------------------------------ */

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=>setTimeout(onResize,200));

/* ---------------------------- MAIN LOOP ---------------------------------------- */

const clock = new THREE.Clock();
const FIXED_DT = 1/120;

function animate(){
  requestAnimationFrame(animate);
  let dt = clock.getDelta();
  dt = Math.min(dt, 1/30);

  if(Game.balls_state==='moving'){
    let steps = Math.min(6, Math.ceil(dt/FIXED_DT));
    for(let i=0;i<steps;i++){ stepPhysics(FIXED_DT); }
    handlePocketsAndSettle();
    if(!anyBallMoving() && pendingPockets.length===0 && fallingCount===0){
      Game.balls_state = 'idle';
      resolveTurn();
      hintEl.style.opacity = Game.gameOver ? '0' : '0.9';
    }
  }

  renderer.render(scene, camera);
}

/* ---------------------------- INIT --------------------------------------------- */

function init(){
  newGame();
  updateCameraFromState();
  animate();
  setTimeout(()=>{
    loadingEl.style.opacity='0';
    setTimeout(()=>loadingEl.style.display='none', 550);
  }, 400);
  setTimeout(()=>{ hintEl.style.opacity='0'; }, 6000);
}

init();

})();
</script>
</body>
