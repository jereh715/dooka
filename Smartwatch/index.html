<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch 9 Bridge Interface</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent); }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            background: #334155;
            color: var(--subtext);
        }
        .active { background: #0284c7; color: #fff; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; }
        .device-item {
            padding: 10px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Engine Status -->
        <div class="card">
            <h2>BLE Engine Setup</h2>
            <div id="engine-status" class="status-badge">Checking Python Bleak...</div>
        </div>

        <!-- Scan Controls -->
        <div class="card">
            <h2>Device Pairing</h2>
            <button id="scan-btn" onclick="startScan()" disabled>Scan for Watch 9</button>
            <div id="device-list" style="margin-top: 10px;"></div>
        </div>

        <!-- Watch Notifications -->
        <div class="card">
            <h2>Send Alert to Watch</h2>
            <input type="text" id="target-mac" placeholder="Target MAC Address (XX:XX:XX:XX:XX:XX)">
            <input type="text" id="watch-msg" placeholder="Notification text...">
            <button id="send-btn" onclick="sendAlert()" disabled>Push Alert to Watch</button>
        </div>
    </div>

    <script>
        let isEngineReady = false;

        async function callPython(funcName, params = {}) {
            if (window.Operat && window.Operat.call) {
                return JSON.parse(await window.Operat.call(funcName, JSON.stringify(params)));
            }
            console.log(`[Bridge Simulation] Called ${funcName} with`, params);
            return { success: true, message: "Simulated response" };
        }

        async function pollStatus() {
            const res = await callPython("get_bleak_status");
            const badge = document.getElementById("engine-status");
            
            if (res.is_installed) {
                badge.innerText = "Bleak Installed & Ready";
                badge.classList.add("active");
                document.getElementById("scan-btn").disabled = false;
                document.getElementById("send-btn").disabled = false;
                isEngineReady = true;
            } else if (res.is_installing) {
                badge.innerText = res.message || "Downloading Bleak...";
                setTimeout(pollStatus, 2000);
            } else {
                badge.innerText = "Error: " + (res.error || "Failed to load");
            }
        }

        async function startScan() {
            const list = document.getElementById("device-list");
            list.innerHTML = "Scanning BLE spectrum...";
            const res = await callPython("scan_for_watches");
            
            if (res.success && res.devices.length > 0) {
                list.innerHTML = "";
                res.devices.forEach(dev => {
                    const item = document.createElement("div");
                    item.className = "device-item";
                    item.innerHTML = `<span><b>${dev.name}</b><br><small>${dev.address}</small></span>
                        <button style="width:auto; padding:6px 12px;" onclick="selectDevice('${dev.address}')">Select</button>`;
                    list.appendChild(item);
                });
            } else {
                list.innerHTML = "No devices found. Make sure Bluetooth is turned on.";
            }
        }

        function selectDevice(address) {
            document.getElementById("target-mac").value = address;
        }

        async function sendAlert() {
            const address = document.getElementById("target-mac").value;
            const message = document.getElementById("watch-msg").value;
            if (!address || !message) return alert("Enter both MAC address and message.");

            const res = await callPython("send_watch_notification", { address, message });
            if (res.success) {
                alert("Alert pushed successfully!");
            } else {
                alert("Failed: " + res.error);
            }
        }

        // Start initialization polling
        pollStatus();
    </script>
</body>
</html>
