<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugin Tester</title>
<style>
  :root { --bg:#0d0f17; --card:#161925; --line:#232838; --text:#e1e4ed; --dim:#7a8499;
          --pass:#00c853; --warn:#f5a524; --fail:#ea4335; --idle:#3a4258; --accent:#3886ff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px 16px 40px; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:14px; line-height:1.4; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  button { border:none; border-radius:6px; padding:8px 12px; font-weight:600; font-size:12px;
           color:#fff; background:var(--accent); cursor:pointer; }
  button.ghost { background:#2d3448; }
  button:disabled { opacity:.5; }
  button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  #summary { color:var(--dim); font-size:12px; margin-left:auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; overflow:hidden; }
  section > h2 { margin:0; padding:10px 12px; font-size:14px; border-bottom:1px solid var(--line); }
  .row { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--idle); margin-top:4px; flex:none; }
  .dot.pass { background:var(--pass); } .dot.warn { background:var(--warn); }
  .dot.fail { background:var(--fail); } .dot.run { background:var(--accent); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .info { flex:1; min-width:0; }
  .name { font-weight:600; }
  .tag { color:var(--dim); font-weight:400; font-size:11px; margin-left:6px; }
  .detail { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--dim);
            margin-top:3px; word-break:break-word; white-space:pre-wrap; }
  .detail.pass { color:var(--pass); } .detail.warn { color:var(--warn); } .detail.fail { color:var(--fail); }
  .media { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .media .btns { display:flex; gap:8px; flex-wrap:wrap; }
  audio, video { width:100%; border-radius:6px; background:#000; }
  video { max-height:200px; } img#img { max-width:100%; max-height:200px; object-fit:contain; display:none; border-radius:6px; }
  pre#log { margin:0; padding:10px 12px; max-height:180px; overflow:auto; font-size:11px; color:var(--dim);
            font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; }
</style>
</head>
<body>

<h1>Plugin Tester</h1>
<div class="sub">Calls the player, notifications, location and camera plugins through the local Operat server.
  On desktop most checks report mock responses (amber). Run on a phone for real results.</div>

<div class="bar">
  <button id="runAll">Run all checks</button>
  <button id="clearAll" class="ghost">Reset</button>
  <span id="summary"></span>
</div>

<div id="groups"></div>

<section>
  <h2>Playback</h2>
  <div class="media">
    <div class="btns">
      <button class="ghost" data-load="Audio">Load first audio</button>
      <button class="ghost" data-load="Video">Load first video</button>
      <button class="ghost" data-load="Images">Load first image</button>
    </div>
    <div id="nowPlaying" class="detail">Scan each type above first, then load a file.</div>
    <audio id="aud" controls></audio>
    <video id="vid" controls playsinline></video>
    <img id="img" alt="Loaded image">
  </div>
</section>

<section>
  <h2>Event log</h2>
  <pre id="log"></pre>
</section>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const state = { media: null, nowTitle: null };
  const tests = [];

  const P = (d) => ({ state: 'pass', detail: d });
  const W = (d) => ({ state: 'warn', detail: d });
  const F = (d) => ({ state: 'fail', detail: d });

  function def(group, name, fn, manual) { tests.push({ group, name, fn, manual: !!manual, id: tests.length }); }

  function log(msg) {
    const el = $('#log');
    const t = new Date().toLocaleTimeString();
    el.textContent += '[' + t + '] ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
  }

  async function getJSON(url) {
    const r = await fetch(url);
    let j = null;
    try { j = await r.json(); } catch (e) {}
    return { r, j };
  }

  const streamUrl = (uri) => '/player/stream?uri=' + encodeURIComponent(uri);
  const isMock = (uri) => String(uri).indexOf('mock_') === 0;

  function firstItem(type) {
    const o = (state.media && state.media[type]) || {};
    const k = Object.keys(o).sort((a, b) => a.localeCompare(b))[0];
    return k ? { name: k, uri: o[k] } : null;
  }

  // Reads up to n bytes of a response body, then cancels the rest.
  async function readUpTo(resp, n) {
    const reader = resp.body.getReader();
    let got = 0;
    while (got < n) {
      const c = await reader.read();
      if (c.done) break;
      got += c.value.length;
    }
    try { await reader.cancel(); } catch (e) {}
    return got;
  }

  function once(el, ev, ms) {
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { el.removeEventListener(ev, h); reject(new Error('Timed out waiting for "' + ev + '"')); }, ms);
      function h() { clearTimeout(t); resolve(); }
      el.addEventListener(ev, h, { once: true });
    });
  }

  // ---------------- Core ----------------
  def('Core', 'Server reachable', async () => {
    const { r, j } = await getJSON('/api/status');
    if (!r.ok || !j) return F('HTTP ' + r.status);
    return P(j.status + ' (projection mode: ' + j.mode + ')');
  });

  // ---------------- Location ----------------
  def('Location', 'Last known position', async () => {
    const { r, j } = await getJSON('/api/hardware/location');
    if (!j) return F('HTTP ' + r.status);
    if (j.error) return j.lat !== undefined ? W('Desktop mock: ' + j.lat + ', ' + j.lon) : F(j.error);
    if (j.status === 'Permission Requested') return W('Permission requested. Allow it, then run again.');
    if (j.lat !== undefined) return P(j.lat.toFixed(5) + ', ' + j.lon.toFixed(5) + ' (accuracy ' + Math.round(j.accuracy) + ' m)');
    return W(j.message || 'No cached fix yet. Open a maps app once, then run again.');
  });

  // ---------------- Notifications ----------------
  def('Notifications', 'Standard notification', async () => {
    const q = new URLSearchParams({ title: 'Operat test', msg: 'Hello from the plugin tester' });
    const { r, j } = await getJSON('/api/hardware/notification?' + q);
    if (!j || j.error) return F(j ? j.error : 'HTTP ' + r.status);
    if (j.status === 'Permission Requested') return W('Permission requested. Allow it, then run again.');
    if (/^Mock/.test(j.status)) return W('Desktop mock: ' + j.status);
    return P(j.message || j.status);
  });

  def('Notifications', 'Media notification (play, then pause)', async () => {
    const base = '/player/api/notification/media?title=' + encodeURIComponent('Test track') + '&action=';
    const a = await getJSON(base + 'play');
    if (!a.j) return F('HTTP ' + a.r.status);
    if (!a.j.success) return /permission/i.test(a.j.status) ? W(a.j.status + ' Allow it, then run again.') : F(a.j.status);
    const b = await getJSON(base + 'pause');
    if (!b.j || !a.j.state.is_playing || b.j.state.is_playing) return F('Play/pause state did not toggle');
    return /Mock/.test(a.j.status) ? W('Desktop mock. State toggles correctly.') : P(a.j.status + '. Check the shade for controls.');
  });

  // ---------------- Camera ----------------
  def('Camera', 'Open system camera', async () => {
    const { r, j } = await getJSON('/api/hardware/camera');
    if (!j) return F('HTTP ' + r.status);
    if (j.error) return /mobile hardware/i.test(j.error) ? W('Desktop: ' + j.error) : F(j.error);
    if (/Permission/i.test(j.status)) return W(j.status + '. Allow it, then run again.');
    return P(j.status + '. Take a photo; the status line should say it was captured.');
  }, true);

  def('Camera', 'Capture result reaches the server', async () => {
    const { j } = await getJSON('/api/status');
    if (/Photo Captured/i.test(j.status)) return P(j.status);
    return W('Last status: "' + j.status + '". Run the camera test and take a photo first.');
  }, true);

  // ---------------- Projection (video mode) ----------------
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Waits for a status line that matches `re` and differs from `before`
  // (so an old message from a previous run is not mistaken for a new one).
  async function waitStatus(re, ms, before) {
    const end = Date.now() + ms;
    while (Date.now() < end) {
      const { j } = await getJSON('/api/status');
      if (j && j.status !== before && re.test(j.status)) return j.status;
      await sleep(1000);
    }
    return null;
  }

  def('Projection (video)', 'Start screen recording', async () => {
    const before = (await getJSON('/api/status')).j.status;
    const { r, j } = await getJSON('/api/hardware/projection?mode=video');
    if (!j) return F('HTTP ' + r.status);
    if (j.error) return /requires an Android/i.test(j.error) ? W('Desktop: ' + j.error) : F(j.error);
    const s = await waitStatus(/Capture Pipeline Active|Projection ready|Canceled/i, 25000, before);
    if (!s) return W('Request sent, but nothing confirmed in 25s. Accept the system dialog, then run again.');
    if (/Canceled/i.test(s)) return W('Cancelled in the system dialog.');
    return P(s + '\nThe "Screen recording in progress" notification should be showing.');
  }, true);

  def('Projection (video)', 'Stop screen recording', async () => {
    const before = (await getJSON('/api/status')).j.status;
    const { r, j } = await getJSON('/api/hardware/stop_projection');
    if (!j) return F('HTTP ' + r.status);
    if (j.error) return F(j.error);
    if (/mock/i.test(j.message || '')) return W('Desktop mock: ' + j.message);
    const s = await waitStatus(/Video recorded natively/i, 15000, before);
    return s ? P(s) : W('Stopped, but no "video saved" message within 15s.');
  }, true);

  def('Projection (video)', 'Recording notification (show, then stop)', async () => {
    const a = await getJSON('/api/hardware/notification/projection?state=start');
    if (!a.j) return F('HTTP ' + a.r.status);
    if (!a.j.success) return /permission/i.test(a.j.status) ? W(a.j.status + ' Allow it, then run again.') : F(a.j.status);
    await sleep(2500);
    const b = await getJSON('/api/hardware/notification/projection?state=stop');
    if (/Mock/.test(a.j.status)) return W('Desktop mock: ' + a.j.status);
    return b.j && b.j.success ? P('Posted "in progress", then "stopped". Check the shade.') : F(b.j ? b.j.status : 'HTTP ' + b.r.status);
  }, true);

  // ---------------- Player ----------------
  ['Audio', 'Video', 'Images'].forEach((type) => {
    def('Player', 'Scan ' + type.toLowerCase(), async () => {
      const { r, j } = await getJSON('/player/api/scan?type=' + type);
      if (!j) return F('HTTP ' + r.status);
      if (!j.success) return /permission/i.test(j.error) ? W(j.error) : F(j.error);
      const m = await getJSON('/player/api/media');
      state.media = m.j;
      const items = Object.keys(m.j[type] || {});
      if (!items.length) return W('Scan succeeded but found 0 files');
      if (isMock(m.j[type][items[0]])) return W('Desktop mock: ' + items.length + ' fake item');
      return P(items.length + ' files found');
    });
  });

  def('Player', 'Stream: full response and byte range', async () => {
    const it = firstItem('Audio') || firstItem('Video') || firstItem('Images');
    if (!it) return W('No scanned media. Run the scans first.');
    if (isMock(it.uri)) return W('Desktop mock URI. Needs a device.');
    const url = streamUrl(it.uri);

    const full = await fetch(url);
    const type = full.headers.get('content-type');
    const len = full.headers.get('content-length');
    const ar = full.headers.get('accept-ranges');
    await readUpTo(full, 1);
    if (!full.ok) return F('Full request returned HTTP ' + full.status);

    if (ar !== 'bytes' || !len) return W('Server could not report a size, so ranges are off. type=' + type);

    const part = await fetch(url, { headers: { Range: 'bytes=0-1023' } });
    const got = await readUpTo(part, 1024);
    const cr = part.headers.get('content-range');
    const expect = Math.min(1024, Number(len));
    if (part.status !== 206) return F('Range request returned HTTP ' + part.status + ' instead of 206');
    if (got !== expect) return F('Expected ' + expect + ' bytes, got ' + got);
    return P(it.name + '\ntype=' + type + ', size=' + len + ' bytes\nrange 0-1023 -> 206, ' + cr);
  });

  def('Player', 'Stream rejects non-media URIs', async () => {
    const r = await fetch('/player/stream?uri=' + encodeURIComponent('content://com.android.contacts/contacts'));
    if (r.status === 403) return P('HTTP 403 as expected');
    const text = await r.text();
    if (/MOCK MEDIA/.test(text)) return W('Desktop mock answers before the check. Only enforced on a device.');
    return F('Expected 403, got HTTP ' + r.status);
  });

  def('Player', 'Seeking in audio (needs byte ranges)', async () => {
    const it = firstItem('Audio');
    if (!it) return W('Scan audio first.');
    if (isMock(it.uri)) return W('Desktop mock URI. Needs a device.');
    const a = $('#aud');
    a.src = streamUrl(it.uri);
    await once(a, 'loadedmetadata', 10000);
    if (!isFinite(a.duration) || a.duration < 2) return W('Track too short or unknown length to test seeking.');
    const target = a.duration / 2;
    a.currentTime = target;
    await once(a, 'seeked', 10000);
    const off = Math.abs(a.currentTime - target);
    return off < 2 ? P('Jumped to ' + a.currentTime.toFixed(1) + 's of ' + a.duration.toFixed(1) + 's') : F('Landed ' + off.toFixed(1) + 's away from target');
  }, true);

  // ---------------- Rendering & running ----------------
  function render() {
    const root = $('#groups');
    root.innerHTML = '';
    const groups = [];
    tests.forEach((t) => { if (groups.indexOf(t.group) < 0) groups.push(t.group); });

    groups.forEach((g) => {
      const sec = document.createElement('section');
      const h = document.createElement('h2');
      h.textContent = g;
      sec.appendChild(h);

      tests.filter((t) => t.group === g).forEach((t) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = 'row' + t.id;

        const dot = document.createElement('div');
        dot.className = 'dot';

        const info = document.createElement('div');
        info.className = 'info';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = t.name;
        if (t.manual) {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = 'run manually';
          name.appendChild(tag);
        }
        const detail = document.createElement('div');
        detail.className = 'detail';
        info.append(name, detail);

        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.textContent = 'Run';
        btn.onclick = () => runTest(t);

        row.append(dot, info, btn);
        sec.appendChild(row);
      });
      root.appendChild(sec);
    });
  }

  function paint(t, s, detail) {
    const row = $('#row' + t.id);
    row.querySelector('.dot').className = 'dot ' + s;
    const d = row.querySelector('.detail');
    d.className = 'detail ' + s;
    d.textContent = detail;
  }

  async function runTest(t) {
    const btn = $('#row' + t.id + ' button');
    btn.disabled = true;
    paint(t, 'run', 'Running...');
    let res;
    try { res = await t.fn(); } catch (e) { res = F(e && e.message ? e.message : String(e)); }
    t.result = res.state;
    paint(t, res.state, res.detail);
    log(t.group + ' / ' + t.name + ': ' + res.state.toUpperCase());
    btn.disabled = false;
    summarize();
  }

  function summarize() {
    const c = { pass: 0, warn: 0, fail: 0 };
    tests.forEach((t) => { if (t.result) c[t.result]++; });
    $('#summary').textContent = c.pass + ' passed, ' + c.warn + ' need attention, ' + c.fail + ' failed';
  }

  $('#runAll').onclick = async () => {
    const btn = $('#runAll');
    btn.disabled = true;
    for (const t of tests.filter((x) => !x.manual)) { await runTest(t); }
    btn.disabled = false;
  };

  $('#clearAll').onclick = () => { tests.forEach((t) => { t.result = null; }); render(); $('#summary').textContent = ''; $('#log').textContent = ''; };

  // ---------------- Manual playback ----------------
  document.querySelectorAll('[data-load]').forEach((b) => {
    b.onclick = () => {
      const type = b.getAttribute('data-load');
      const it = firstItem(type);
      if (!it) { $('#nowPlaying').textContent = 'Nothing scanned for ' + type + ' yet.'; return; }
      if (isMock(it.uri)) { $('#nowPlaying').textContent = 'Desktop mock item. Needs a device.'; return; }
      $('#aud').pause(); $('#vid').pause();
      $('#img').style.display = 'none';
      $('#nowPlaying').textContent = it.name;
      state.nowTitle = null;
      if (type === 'Audio') { state.nowTitle = it.name; $('#aud').src = streamUrl(it.uri); $('#aud').play().catch((e) => log('audio: ' + e)); }
      if (type === 'Video') { $('#vid').src = streamUrl(it.uri); $('#vid').play().catch((e) => log('video: ' + e)); }
      if (type === 'Images') { $('#img').src = streamUrl(it.uri); $('#img').style.display = 'block'; }
    };
  });

  // Audio events drive the notification, same as the real player.
  function notify(action) {
    if (!state.nowTitle) return;
    fetch('/player/api/notification/media?title=' + encodeURIComponent(state.nowTitle) + '&action=' + action).catch(() => {});
    log('audio ' + action + ' -> notification updated');
  }
  $('#aud').addEventListener('play', () => notify('play'));
  $('#aud').addEventListener('pause', () => notify('pause'));
  ['aud', 'vid', 'img'].forEach((id) => $('#' + id).addEventListener('error', () => log(id + ': failed to load the stream')));

  render();
})();
</script>
</body>
</html>
