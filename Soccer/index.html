<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D Arcade Soccer - 3v3 Match</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      background-color: #15803d;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Scoreboard Header */
    #ui-header {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.15);
      padding: 6px 18px;
      border-radius: 30px;
      color: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .team-badge {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .team-user { color: #38bdf8; }
    .team-ai { color: #f43f5e; }

    .score-display {
      font-size: 20px;
      font-weight: 900;
      background: #020617;
      padding: 2px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      letter-spacing: 2px;
    }

    #match-timer {
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
      min-width: 45px;
      text-align: center;
    }

    /* Mobile Controls Overlay */
    #controls-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #joystick-zone {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      pointer-events: auto;
    }

    #joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 45px;
      height: 45px;
      margin-top: -22.5px;
      margin-left: -22.5px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
      transition: transform 0.04s linear;
    }

    #action-zone {
      position: absolute;
      bottom: 25px;
      right: 20px;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .btn-action {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: none;
      color: white;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    .btn-action:active { transform: scale(0.92); }

    #btn-shoot {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      border: 2px solid #fda4af;
    }

    #btn-pass {
      background: linear-gradient(135deg, #10b981, #047857);
      border: 2px solid #6ee7b7;
      width: 55px;
      height: 55px;
      align-self: flex-end;
    }

    /* Overlays */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: 36px;
      font-weight: 900;
      margin: 0 0 8px 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay-subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .btn-main {
      padding: 10px 28px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      background: #fbbf24;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-header">
      <span class="team-badge team-user">BLUE TEAM</span>
      <span class="score-display"><span id="score-user">0</span> - <span id="score-ai">0</span></span>
      <span class="team-badge team-ai">RED TEAM</span>
      <div style="border-left: 1px solid rgba(255,255,255,0.2); height: 16px;"></div>
      <div id="match-timer">00:00</div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="controls-layer">
      <div id="joystick-zone">
        <div id="joystick-stick"></div>
      </div>
      <div id="action-zone">
        <button class="btn-action" id="btn-pass">Pass</button>
        <button class="btn-action" id="btn-shoot">Shoot</button>
      </div>
    </div>

    <div id="banner-screen" class="overlay-screen">
      <h1 id="banner-title" class="overlay-title">GOAL!</h1>
      <p id="banner-sub" class="overlay-subtitle">Get ready for kick-off</p>
      <button id="banner-btn" class="btn-main">Continue</button>
    </div>
  </div>

  <script>
    // --- CANVAS SETUP ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Pitch Dimensions
    const PITCH_W = 900;
    const PITCH_H = 550;
    const GOAL_H = 130;
    const BALL_R = 7;
    const PLAYER_R = 14;

    function resizeCanvas() {
      const scale = Math.min(window.innerWidth / PITCH_W, window.innerHeight / PITCH_H) * 0.95;
      canvas.width = PITCH_W;
      canvas.height = PITCH_H;
      canvas.style.width = `${PITCH_W * scale}px`;
      canvas.style.height = `${PITCH_H * scale}px`;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- GAME STATE ---
    let scoreUser = 0;
    let scoreAI = 0;
    let matchTimeSeconds = 0;
    let isPaused = false;
    let isGameOver = false;
    let lastTime = performance.now();

    const input = { moveX: 0, moveY: 0, shoot: false, pass: false };

    // --- BALL STRUCTURE ---
    const ball = {
      x: PITCH_W / 2,
      y: PITCH_H / 2,
      vx: 0,
      vy: 0,
      carrier: null, // Track player holding ball
      dribbleAngle: 0, // Dynamic wobble when dribbling
      tackleCooldown: 0 // Prevent instant retackling
    };

    // --- PLAYER CLASS ---
    class Player {
      constructor(x, y, team, role, isUser = false) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.team = team; // 'blue' or 'red'
        this.role = role; // 'attacker', 'defender', 'keeper'
        this.isUser = isUser;
        this.speed = isUser ? 210 : 175;
        this.facingX = team === 'blue' ? 1 : -1;
        this.facingY = 0;
      }

      reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.vx = 0;
        this.vy = 0;
      }

      update(dt) {
        if (this.isUser) {
          // Player Input
          let dx = input.moveX;
          let dy = input.moveY;
          if (dx !== 0 || dy !== 0) {
            const len = Math.hypot(dx, dy);
            this.vx = (dx / len) * this.speed;
            this.vy = (dy / len) * this.speed;
            this.facingX = dx / len;
            this.facingY = dy / len;
          } else {
            this.vx = 0;
            this.vy = 0;
          }
        } else {
          // AI Logic
          this.updateAI(dt);
        }

        // Apply Velocity
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Boundaries
        this.x = Math.max(PLAYER_R, Math.min(PITCH_W - PLAYER_R, this.x));
        this.y = Math.max(PLAYER_R, Math.min(PITCH_H - PLAYER_R, this.y));
      }

      updateAI(dt) {
        let targetX = this.startX;
        let targetY = this.startY;

        const isTeammateWithBall = ball.carrier && ball.carrier.team === this.team;
        const isOpponentWithBall = ball.carrier && ball.carrier.team !== this.team;

        if (this.role === 'keeper') {
          // Goalkeeper: Tracks ball vertically within goal mouth
          targetX = this.team === 'blue' ? 30 : PITCH_W - 30;
          targetY = Math.max(PITCH_H / 2 - GOAL_H / 2 + 10, Math.min(PITCH_H / 2 + GOAL_H / 2 - 10, ball.y));
        } else if (!ball.carrier && Math.hypot(ball.x - this.x, ball.y - this.y) < 250) {
          // Free ball: Attack ball
          targetX = ball.x;
          targetY = ball.y;
        } else if (isOpponentWithBall) {
          // Defend: Press carrier
          if (this.role === 'attacker') {
            targetX = (ball.x + this.startX) / 2;
            targetY = (ball.y + this.startY) / 2;
          } else {
            targetX = ball.x;
            targetY = ball.y;
          }
        } else if (isTeammateWithBall) {
          // Support Attack: Run forward into space
          targetX = this.team === 'blue' ? ball.x + 120 : ball.x - 120;
          targetY = this.startY;
        } else {
          // Default Position
          targetX = ball.x * 0.3 + this.startX * 0.7;
          targetY = ball.y * 0.3 + this.startY * 0.7;
        }

        // Move towards target
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 5) {
          this.vx = (dx / dist) * this.speed;
          this.vy = (dy / dist) * this.speed;
          this.facingX = dx / dist;
          this.facingY = dy / dist;
        } else {
          this.vx = 0;
          this.vy = 0;
        }

        // AI Kick Behaviors
        if (ball.carrier === this) {
          const goalTargetX = this.team === 'blue' ? PITCH_W : 0;
          const distToGoal = Math.hypot(goalTargetX - this.x, PITCH_H / 2 - this.y);

          if (distToGoal < 260) {
            // Shoot at goal
            shootBall(this, goalTargetX, PITCH_H / 2 + (Math.random() * 60 - 30), 550);
          } else if (Math.random() < 0.01) {
            // Pass to open teammate
            const teammate = players.find(p => p !== this && p.team === this.team);
            if (teammate) {
              shootBall(this, teammate.x, teammate.y, 400);
            }
          }
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Selection ring for User
        if (this.isUser) {
          ctx.beginPath();
          ctx.arc(0, 0, PLAYER_R + 5, 0, Math.PI * 2);
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Player Circle Body
        ctx.beginPath();
        ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2);
        ctx.fillStyle = this.team === 'blue' ? '#38bdf8' : '#f43f5e';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Facing Direction Marker
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(this.facingX * (PLAYER_R + 4), this.facingY * (PLAYER_R + 4));
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.restore();
      }
    }

    // --- TEAMS SETUP (3v3) ---
    const players = [
      // Blue Team (User + 2 AI)
      new Player(120, PITCH_H / 2, 'blue', 'keeper'),
      new Player(320, PITCH_H / 2 - 120, 'blue', 'defender'),
      new Player(380, PITCH_H / 2 + 60, 'blue', 'attacker', true), // USER

      // Red Team (3 AI)
      new Player(PITCH_W - 120, PITCH_H / 2, 'red', 'keeper'),
      new Player(PITCH_W - 320, PITCH_H / 2 + 120, 'red', 'defender'),
      new Player(PITCH_W - 380, PITCH_H / 2 - 60, 'red', 'attacker')
    ];

    const userPlayer = players.find(p => p.isUser);

    // --- DYNAMIC BALL & DRIBBLE MECHANICS ---
    function updateBall(dt) {
      if (ball.tackleCooldown > 0) ball.tackleCooldown -= dt;

      if (ball.carrier) {
        // Dribbling Physics: Wobbles slightly in front of carrier
        ball.dribbleAngle += dt * 8;
        const dribbleDist = PLAYER_R + BALL_R + 2;
        const wobble = Math.sin(ball.dribbleAngle) * 4;

        ball.x = ball.carrier.x + ball.carrier.facingX * dribbleDist - ball.carrier.facingY * wobble;
        ball.y = ball.carrier.y + ball.carrier.facingY * dribbleDist + ball.carrier.facingX * wobble;
        ball.vx = 0;
        ball.vy = 0;

        // User Action Controls
        if (ball.carrier.isUser) {
          if (input.shoot) {
            shootBall(userPlayer, PITCH_W, PITCH_H / 2, 600);
            input.shoot = false;
          } else if (input.pass) {
            // Find nearest teammate to auto-pass towards
            const mate = players.find(p => p.team === 'blue' && !p.isUser);
            if (mate) shootBall(userPlayer, mate.x, mate.y, 420);
            else shootBall(userPlayer, userPlayer.x + userPlayer.facingX * 200, userPlayer.y + userPlayer.facingY * 200, 350);
            input.pass = false;
          }
        }
      } else {
        // Free ball movement & friction
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.vx *= 0.96;
        ball.vy *= 0.96;

        // Wall Bounce
        if (ball.y < BALL_R || ball.y > PITCH_H - BALL_R) {
          ball.vy *= -0.8;
          ball.y = Math.max(BALL_R, Math.min(PITCH_H - BALL_R, ball.y));
        }
      }

      // Collisions & Tackling Mechanics
      players.forEach(p => {
        const dist = Math.hypot(p.x - ball.x, p.y - ball.y);

        if (ball.carrier) {
          // Dispossess / Tackle opponent carrier
          if (ball.carrier !== p && ball.carrier.team !== p.team && dist < PLAYER_R + BALL_R + 4) {
            if (ball.tackleCooldown <= 0) {
              ball.carrier = p;
              ball.tackleCooldown = 0.6; // Cooldown to avoid sticky back-and-forth loops
            }
          }
        } else {
          // Loose ball pickup
          if (dist < PLAYER_R + BALL_R + 3 && ball.tackleCooldown <= 0) {
            ball.carrier = p;
          }
        }
      });

      // Goal Checks
      if (ball.x < 15) {
        if (ball.y > PITCH_H / 2 - GOAL_H / 2 && ball.y < PITCH_H / 2 + GOAL_H / 2) {
          handleGoal('AI');
        } else {
          ball.vx *= -0.8;
          ball.x = 15;
        }
      } else if (ball.x > PITCH_W - 15) {
        if (ball.y > PITCH_H / 2 - GOAL_H / 2 && ball.y < PITCH_H / 2 + GOAL_H / 2) {
          handleGoal('USER');
        } else {
          ball.vx *= -0.8;
          ball.x = PITCH_W - 15;
        }
      }
    }

    function shootBall(player, targetX, targetY, power) {
      const dx = targetX - player.x;
      const dy = targetY - player.y;
      const len = Math.hypot(dx, dy) || 1;

      ball.carrier = null;
      ball.tackleCooldown = 0.4;
      ball.vx = (dx / len) * power;
      ball.vy = (dy / len) * power;
    }

    function resetPositions() {
      ball.x = PITCH_W / 2;
      ball.y = PITCH_H / 2;
      ball.vx = 0;
      ball.vy = 0;
      ball.carrier = null;
      players.forEach(p => p.reset());
    }

    // --- DRAWING FUNCTIONS ---
    function drawPitch() {
      // Field Background
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, 0, PITCH_W, PITCH_H);

      // Pitch Grass Stripes
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      for (let i = 0; i < PITCH_W; i += 100) {
        if ((i / 100) % 2 === 0) ctx.fillRect(i, 0, 50, PITCH_H);
      }

      // Markings
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 3;

      // Outer Bounds
      ctx.strokeRect(15, 15, PITCH_W - 30, PITCH_H - 30);

      // Halfway Line
      ctx.beginPath();
      ctx.moveTo(PITCH_W / 2, 15);
      ctx.lineTo(PITCH_W / 2, PITCH_H - 15);
      ctx.stroke();

      // Center Circle
      ctx.beginPath();
      ctx.arc(PITCH_W / 2, PITCH_H / 2, 70, 0, Math.PI * 2);
      ctx.stroke();

      // Penalty Boxes
      ctx.strokeRect(15, PITCH_H / 2 - 120, 110, 240);
      ctx.strokeRect(PITCH_W - 125, PITCH_H / 2 - 120, 110, 240);

      // Goals Neting Area
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(0, PITCH_H / 2 - GOAL_H / 2, 15, GOAL_H);
      ctx.fillRect(PITCH_W - 15, PITCH_H / 2 - GOAL_H / 2, 15, GOAL_H);
      ctx.strokeRect(0, PITCH_H / 2 - GOAL_H / 2, 15, GOAL_H);
      ctx.strokeRect(PITCH_W - 15, PITCH_H / 2 - GOAL_H / 2, 15, GOAL_H);
    }

    function drawBall() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#000000';
      ctx.stroke();
      ctx.restore();
    }

    // --- TOUCH & JOYSTICK LOGIC ---
    const joystickZone = document.getElementById('joystick-zone');
    const joystickStick = document.getElementById('joystick-stick');
    let joystickActive = false;
    let joystickCenter = { x: 0, y: 0 };

    joystickZone.addEventListener('touchstart', (e) => {
      joystickActive = true;
      const rect = joystickZone.getBoundingClientRect();
      joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      handleJoystickMove(e.touches[0]);
    });

    window.addEventListener('touchmove', (e) => {
      if (!joystickActive) return;
      for (let i = 0; i < e.touches.length; i++) {
        if (e.touches[i].target === joystickZone || joystickZone.contains(e.touches[i].target)) {
          handleJoystickMove(e.touches[i]);
          break;
        }
      }
    });

    window.addEventListener('touchend', () => {
      if (joystickActive) {
        joystickActive = false;
        input.moveX = 0;
        input.moveY = 0;
        joystickStick.style.transform = `translate(0px, 0px)`;
      }
    });

    function handleJoystickMove(touch) {
      const dx = touch.clientX - joystickCenter.x;
      const dy = touch.clientY - joystickCenter.y;
      const maxDist = 40;
      const dist = Math.min(Math.hypot(dx, dy), maxDist);
      const angle = Math.atan2(dy, dx);

      const stickX = Math.cos(angle) * dist;
      const stickY = Math.sin(angle) * dist;

      joystickStick.style.transform = `translate(${stickX}px, ${stickY}px)`;
      input.moveX = stickX / maxDist;
      input.moveY = stickY / maxDist;
    }

    // Action Buttons
    const btnShoot = document.getElementById('btn-shoot');
    const btnPass = document.getElementById('btn-pass');

    btnShoot.addEventListener('touchstart', (e) => { e.preventDefault(); input.shoot = true; });
    btnShoot.addEventListener('touchend', () => input.shoot = false);
    btnShoot.addEventListener('mousedown', () => input.shoot = true);
    btnShoot.addEventListener('mouseup', () => input.shoot = false);

    btnPass.addEventListener('touchstart', (e) => { e.preventDefault(); input.pass = true; });
    btnPass.addEventListener('touchend', () => input.pass = false);
    btnPass.addEventListener('mousedown', () => input.pass = true);
    btnPass.addEventListener('mouseup', () => input.pass = false);

    // Keyboard Fallback (WASD / Arrows + Space / K)
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') input.shoot = true;
      if (e.code === 'KeyK') input.pass = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') input.shoot = false;
      if (e.code === 'KeyK') input.pass = false;
    });

    function updateKeyboard() {
      if (joystickActive) return;
      let kx = 0, ky = 0;
      if (keys['KeyA'] || keys['ArrowLeft']) kx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) kx += 1;
      if (keys['KeyW'] || keys['ArrowUp']) ky -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) ky += 1;

      if (kx !== 0 || ky !== 0) {
        const len = Math.hypot(kx, ky);
        input.moveX = kx / len;
        input.moveY = ky / len;
      } else if (!joystickActive) {
        input.moveX = 0;
        input.moveY = 0;
      }
    }

    // --- MATCH FLOW & OVERLAYS ---
    function updateMatchTimer(dt) {
      if (isPaused || isGameOver) return;

      matchTimeSeconds += dt * 10;
      const totalSeconds = Math.floor(matchTimeSeconds);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('match-timer').innerText = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      if (minutes >= 10 && !isGameOver) {
        isGameOver = true;
        const res = scoreUser > scoreAI ? "BLUE TEAM WINS! 🎉" : (scoreUser < scoreAI ? "RED TEAM WINS! 🤖" : "MATCH DRAW!");
        showOverlay("FULL TIME", `Final Score: ${scoreUser} - ${scoreAI}. ${res}`, "Play Again", () => {
          location.reload();
        });
      }
    }

    function handleGoal(scorer) {
      isPaused = true;
      if (scorer === 'USER') {
        scoreUser++;
        document.getElementById('score-user').innerText = scoreUser;
        showOverlay("GOAL! ⚽", "Blue team scored a goal!", "Resume Match", () => {
          resetPositions();
          isPaused = false;
        });
      } else {
        scoreAI++;
        document.getElementById('score-ai').innerText = scoreAI;
        showOverlay("GOAL FOR RED!", "The Red team scored.", "Resume Match", () => {
          resetPositions();
          isPaused = false;
        });
      }
    }

    function showOverlay(title, sub, btnText, onClick) {
      const bannerScreen = document.getElementById('banner-screen');
      document.getElementById('banner-title').innerText = title;
      document.getElementById('banner-sub').innerText = sub;
      const btn = document.getElementById('banner-btn');
      btn.innerText = btnText;

      bannerScreen.classList.add('active');
      btn.onclick = () => {
        bannerScreen.classList.remove('active');
        onClick();
      };
    }

    // --- MAIN GAME LOOP ---
    function loop(currentTime) {
      requestAnimationFrame(loop);

      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      if (!isPaused && !isGameOver) {
        updateKeyboard();
        players.forEach(p => p.update(dt));
        updateBall(dt);
        updateMatchTimer(dt);
      }

      // Render Step
      drawPitch();
      players.forEach(p => p.draw());
      drawBall();
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
