<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player MiniApp Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f111a;
            color: #e1e4ed;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar for MiniApp Context -->
    <div class="bg-[#161925] border-b border-[#232838] px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-xl">📦</span>
            <div>
                <h1 class="text-sm font-bold text-white leading-tight">Media Hub Extension</h1>
                <p class="text-[11px] text-gray-400 font-mono">Running inside Workspace Overlay</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Native Status Refresher -->
            <button onclick="reloadPlayer()" class="text-xs bg-[#2c3143] hover:bg-[#3886ff] hover:text-white text-[#a2aab8] font-medium py-1.5 px-3 rounded transition-colors duration-150">
                🔄 Hard Reset
            </button>
        </div>
    </div>

    <!-- Embedded Modular Player Frame -->
    <div class="flex-1 w-full h-full bg-black relative">
        <iframe 
            id="player-frame" 
            src="/player/" 
            class="w-full h-full border-none absolute top-0 left-0" 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <script>
        // Simple bridge function to reload the inner Flask workspace blueprint frame
        function reloadPlayer() {
            const frame = document.getElementById('player-frame');
            if (frame) {
                frame.src = frame.src;
                console.log("[MINIAPP BRIDGE]: Refreshed underlying module layer.");
            }
        }

        // Wait for the iframe window to load fully before attaching media stream listeners
        const iframe = document.getElementById('player-frame');

        iframe.addEventListener('load', () => {
            try {
                const innerDoc = iframe.contentWindow.document;
                const audioPlayer = innerDoc.getElementById('audio-player');
                const videoPlayer = innerDoc.getElementById('video-player');

                // Strategy: Find the clean text name being displayed in the player UI
                const getCleanTrackName = () => {
                    // 1. Check for standard title containers or headers in your player UI
                    const uiTitle = innerDoc.querySelector('h2') || 
                                    innerDoc.querySelector('.track-title') || 
                                    innerDoc.getElementById('current-track-name');
                    
                    if (uiTitle && uiTitle.innerText.trim()) {
                        return uiTitle.innerText.trim();
                    }

                    // 2. Look for the actively selected list row (e.g., matching a background color or active class)
                    const activeRow = innerDoc.querySelector('.bg-blue-600') || 
                                      innerDoc.querySelector('.active-track') ||
                                      innerDoc.querySelector('[class*="bg-opacity"]'); // Tailored for highlights
                    if (activeRow) {
                        return activeRow.innerText.trim();
                    }

                    return null;
                };

                // Helper function to extract track name and fire notification endpoint
                const triggerTrackNotification = (playerElement) => {
                    let trackName = getCleanTrackName();

                    // Fallback: If the DOM scraper couldn't find a text element, parse the URI string
                    if (!trackName && playerElement && playerElement.src) {
                        const urlParams = new URLSearchParams(playerElement.src.split('?')[1]);
                        const rawUri = urlParams.get('uri');
                        
                        if (rawUri) {
                            trackName = decodeURIComponent(rawUri);
                            if (trackName.includes('/')) {
                                trackName = trackName.substring(trackName.lastIndexOf('/') + 1);
                            }
                        }
                    }

                    // Fire the notification API request with the parsed clean name
                    if (trackName) {
                        fetch(`/api/hardware/notification?title=Now+Playing&msg=${encodeURIComponent(trackName)}`)
                            .catch(err => console.error("MiniApp bridge failed to fire notification:", err));
                    }
                };

                // Attach 'play' event listeners to both native media HTML tags inside the player module
                if (audioPlayer) {
                    audioPlayer.addEventListener('play', () => triggerTrackNotification(audioPlayer));
                }
                if (videoPlayer) {
                    videoPlayer.addEventListener('play', () => triggerTrackNotification(videoPlayer));
                }

            } catch (error) {
                console.error("Could not link media listeners due to iframe constraints:", error);
            }
        });
    </script>
</body>
</html>
