<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operat Image Viewer Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f111a;
            color: #e1e4ed;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            color: #fff;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #3886ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(56, 134, 255, 0.2);
        }
        .btn:hover {
            background: #2a75e6;
        }
        .status-text {
            margin: 15px 0;
            font-size: 13px;
            color: #8a94a6;
            font-family: monospace;
        }
        .image-preview-card {
            background: #1a1d29;
            border: 1px solid #232838;
            border-radius: 12px;
            padding: 10px;
            margin-top: 25px;
            display: none;
        }
        .image-preview-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        .file-name {
            margin-top: 10px;
            font-size: 12px;
            color: #3886ff;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>MiniApp Storage Explorer</h2>
        
        <button class="btn" onclick="openNativePicker()">📂 Select Image from Device</button>
        
        <div id="status-display" class="status-text">Ready to request asset bridge...</div>

        <div id="preview-card" class="image-preview-card">
            <img id="viewer-target" src="" alt="Selected Target Graphic">
            <div id="filename-label" class="file-name"></div>
        </div>
    </div>

    <script>
        const statusDisplay = document.getElementById('status-display');
        const previewCard = document.getElementById('preview-card');
        const viewerTarget = document.getElementById('viewer-target');
        const filenameLabel = document.getElementById('filename-label');

        // 1. Kick off the Native Android Storage Intent via your API
        function openNativePicker() {
            statusDisplay.innerText = "Opening system file provider...";
            fetch('/api/hardware/storage_picker')
                .then(res => res.json())
                .then(data => {
                    statusDisplay.innerText = "System picker active. Awaiting selection...";
                    // Start polling the backend status to look for completion
                    startStatusPolling();
                })
                .catch(err => {
                    statusDisplay.innerText = "Error launching picker: " + err;
                });
        }

        // 2. Poll /api/status until the bridge signals a successful cache operation
        let pollInterval = null;
        function startStatusPolling() {
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(() => {
                fetch('/api/status')
                    .then(res => res.json())
                    .then(data => {
                        statusDisplay.innerText = data.status;
                        
                        // Look for your distinct success message committed inside handler.py
                        if (data.status.includes("Imported asset cached successfully:")) {
                            clearInterval(pollInterval);
                            fetchLatestCachedFile();
                        }
                    });
            }, 1000); // Check every second
        }

        // 3. Look up the cached storage directory list to grab the newest file name
        function fetchLatestCachedFile() {
            fetch('/api/storage/list')
                .then(res => res.json())
                .then(data => {
                    if (data.files && data.files.length > 0) {
                        // Pull the most recently imported file from the list
                        const targetFile = data.files[data.files.length - 1];
                        displayImage(targetFile.name);
                    } else {
                        statusDisplay.innerText = "Status: Cache processing done, but file registry is empty.";
                    }
                });
        }

        // 4. Render the image by pointing its source straight to your raw delivery route
        function displayImage(filename) {
            // Point the src directly to your unrestricted raw storage stream endpoint
            // Cache bust with a unique timestamp query parameter just in case
            const timestamp = new Date().getTime();
            viewerTarget.src = `/api/storage/raw/${encodeURIComponent(filename)}?t=${timestamp}`;
            
            filenameLabel.innerText = filename;
            previewCard.style.display = 'block';
            statusDisplay.innerText = "Status: Image loaded seamlessly via loopback streaming framework.";
        }
    </script>
</body>
</html>
