<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operat Native Bridge Controller</title>
    <style>
        body { font-family: sans-serif; background: #12141c; color: #e1e4ed; padding: 20px; text-align: center; }
        .card { background: #1a1d29; border: 1px solid #232838; padding: 24px; border-radius: 12px; max-width: 400px; margin: 40px auto; }
        h2 { margin-top: 0; color: #fff; font-weight: 400; }
        .btn { background: #3886ff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .status-box { background: #131622; padding: 12px; border-radius: 6px; margin: 15px 0; font-family: monospace; font-size: 12px; text-align: left; border-left: 4px solid #3886ff; }
    </style>
</head>
<body>

<div class="card">
    <h2>Toga Native Bridge</h2>
    
    <div id="status-display" class="status-box">Status: Syncing with handler.py...</div>
    
    <button class="btn" onclick="triggerNativeLocation()">🛰️ Fetch GPS via Python</button>
    <button class="btn" onclick="triggerNativeNotification()">🔔 Send Android Notification</button>
</div>

<script>
    const statusDisplay = document.getElementById('status-display');

    // 1. Periodically poll your existing status API from handler.py to show what Python is doing
    function checkBackendStatus() {
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                statusDisplay.innerText = data.status;
            })
            .catch(() => {
                statusDisplay.innerText = "Status: Bridge connection offline";
            });
    }
    setInterval(checkBackendStatus, 1500);

    // 2. Route the Location request directly to your Python API endpoint
    function triggerNativeLocation() {
        statusDisplay.innerText = "Status: Sending Location intent to Python...";
        fetch('/api/hardware/location', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if(!data.success) alert("Error: " + data.message);
            });
    }

    // 3. Route the Notification request directly to your Python API endpoint
    function triggerNativeNotification() {
        statusDisplay.innerText = "Status: Requesting OS Notification via Python...";
        fetch('/api/hardware/notify', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                title: "Operat OS Alert", 
                message: "Location pipeline successfully processed natively." 
            })
        })
        .then(r => r.json())
        .then(data => {
            if(!data.success) alert("Error: " + data.message);
        });
    }
</script>

</body>
</html>
