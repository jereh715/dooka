<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bouncing Balls Escape Simulation</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    canvas {
      background-color: #1a1a1a;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
    }
    #info {
      margin-top: 15px;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <canvas id="simCanvas" width="600" height="600"></canvas>
  <div id="info">Ball Count: <span id="count">1</span></div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('count');

    // Simulation parameters
    const center = { x: canvas.width / 2, y: canvas.height / 2 };
    const circleRadius = 220;
    const holeAngleSize = Math.PI / 4; // 45-degree hole
    let rotationAngle = 0;
    const rotationSpeed = 0.01; // Speed of circle rotation
    const gravity = 0.2;
    const maxBalls = 300; // Cap to prevent performance lag

    // Ball template
    class Ball {
      constructor(x, y, vx, vy, radius) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = radius;
        this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
        this.isEscaped = false;
      }

      update() {
        this.vy += gravity;
        this.x += this.vx;
        this.y += this.vy;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.closePath();
      }
    }

    let balls = [new Ball(center.x, center.y - 50, (Math.random() - 0.5) * 4, 2, 10)];

    // Utility: Normalize angle between 0 and 2*PI
    function normalizeAngle(angle) {
      return (angle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    }

    function checkCircleCollision(ball) {
      if (ball.isEscaped) return;

      const dx = ball.x - center.x;
      const dy = ball.y - center.y;
      const dist = Math.hypot(dx, dy);

      // Check if ball touches or passes the circle boundary
      if (dist + ball.radius >= circleRadius) {
        // Calculate impact angle relative to center
        let impactAngle = normalizeAngle(Math.atan2(dy, dx));
        
        // Define hole boundaries based on current rotation
        let holeStart = normalizeAngle(rotationAngle);
        let holeEnd = normalizeAngle(rotationAngle + holeAngleSize);

        let isInHole = false;
        if (holeStart < holeEnd) {
          isInHole = impactAngle >= holeStart && impactAngle <= holeEnd;
        } else {
          // Wraps around 2*PI
          isInHole = impactAngle >= holeStart || impactAngle <= holeEnd;
        }

        if (isInHole) {
          // Ball escapes through the gap
          ball.isEscaped = true;
          duplicateBall(ball);
        } else {
          // Bounce inside the circle
          const nx = dx / dist;
          const ny = dy / dist;

          // Reposition ball inside boundary
          ball.x = center.x + nx * (circleRadius - ball.radius);
          ball.y = center.y + ny * (circleRadius - ball.radius);

          // Reflect velocity vector
          const dotProduct = ball.vx * nx + ball.vy * ny;
          ball.vx = (ball.vx - 2 * dotProduct * nx) * 0.98; // 0.98 restitution for damping
          ball.vy = (ball.vy - 2 * dotProduct * ny) * 0.98;
        }
      }
    }

    function duplicateBall(escapedBall) {
      if (balls.length >= maxBalls) return;

      // Spawn two new balls back at the center with fresh random trajectories
      for (let i = 0; i < 2; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 3;
        balls.push(new Ball(
          center.x,
          center.y,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          escapedBall.radius
        ));
      }
    }

    function drawRotatingContainer() {
      ctx.save();
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#ffffff';

      // Draw arc with a gap (hole)
      ctx.beginPath();
      ctx.arc(
        center.x,
        center.y,
        circleRadius,
        rotationAngle + holeAngleSize,
        rotationAngle + Math.PI * 2
      );
      ctx.stroke();
      ctx.restore();
    }

    function animate() {
      // Clear frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Rotate the container gap
      rotationAngle = normalizeAngle(rotationAngle + rotationSpeed);

      drawRotatingContainer();

      // Update and draw balls
      for (let i = balls.length - 1; i >= 0; i--) {
        const ball = balls[i];
        ball.update();
        checkCircleCollision(ball);
        ball.draw();

        // Cleanup balls that fall off screen to keep array lean
        if (
          ball.x < -50 || ball.x > canvas.width + 50 ||
          ball.y < -50 || ball.y > canvas.height + 50
        ) {
          balls.splice(i, 1);
        }
      }

      countDisplay.textContent = balls.length;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
