<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player MiniApp Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f111a;
            color: #e1e4ed;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar for MiniApp Context -->
    <div class="bg-[#161925] border-b border-[#232838] px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-xl">📦</span>
            <div>
                <h1 class="text-sm font-bold text-white leading-tight">Media Hub Extension</h1>
                <p class="text-[11px] text-gray-400 font-mono">Running inside Workspace Overlay</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Native Status Refresher -->
            <button onclick="reloadPlayer()" class="text-xs bg-[#2c3143] hover:bg-[#3886ff] hover:text-white text-[#a2aab8] font-medium py-1.5 px-3 rounded transition-colors duration-150">
                🔄 Hard Reset
            </button>
        </div>
    </div>

    <!-- Embedded Modular Player Frame -->
    <div class="flex-1 w-full h-full bg-black relative">
        <iframe 
            id="player-frame" 
            src="/player/" 
            class="w-full h-full border-none absolute top-0 left-0" 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <script>
        // Simple bridge function to reload the inner Flask workspace blueprint frame if it runs into execution timeouts
        function reloadPlayer() {
            const frame = document.getElementById('player-frame');
            if (frame) {
                frame.src = frame.src;
                console.log("[MINIAPP BRIDGE]: Refreshed underlying module layer.");
            }
        }
    </script>
</body>
</html>
