<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>6 DOF Mobile Flight Simulator - Airport Navigation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000; font-family: monospace; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }

        /* Minimalist Unobstructed HUD Overlay */
        .hud-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 20px;
            color: #00ffcc;
            text-shadow: 0 0 4px rgba(0,255,204,0.6);
        }

        /* Top Instrumentation Strip */
        .top-strip {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .instrument-panel {
            background: rgba(10, 15, 20, 0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            gap: 16px;
            font-size: 13px;
        }

        .inst-item { display: flex; flex-direction: column; align-items: center; }
        .inst-label { font-size: 9px; opacity: 0.75; letter-spacing: 1px; }
        .inst-value { font-size: 16px; font-weight: bold; }

        .nav-panel {
            background: rgba(10, 15, 20, 0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 8px;
            padding: 8px 14px;
            text-align: right;
            font-size: 12px;
        }

        /* Side Controls (Interactive Touch Targets) */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: auto;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .hud-btn {
            background: rgba(10, 15, 20, 0.65);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            border-radius: 6px;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            touch-action: manipulation;
        }

        .hud-btn:active {
            background: rgba(0, 255, 204, 0.3);
            border-color: #00ffcc;
        }

        .trim-box {
            background: rgba(10, 15, 20, 0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .trim-label { font-size: 9px; opacity: 0.8; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- HUD INTERFACE -->
  <div class="hud-overlay">
      <div class="top-strip">
          <div class="instrument-panel">
              <div class="inst-item">
                  <span class="inst-label">AIRSPEED</span>
                  <span class="inst-value" id="val-spd">0 kts</span>
              </div>
              <div class="inst-item">
                  <span class="inst-label">ALTITUDE</span>
                  <span class="inst-value" id="val-alt">0 ft</span>
              </div>
              <div class="inst-item">
                  <span class="inst-label">THROTTLE</span>
                  <span class="inst-value" id="val-thr">50%</span>
              </div>
          </div>

          <div class="nav-panel">
              <div>NAV: <span id="nav-target" style="color:#FFF;">DEST AIRPORT</span></div>
              <div>DIST: <span id="nav-dist">0 nm</span> | HDG: <span id="nav-hdg">0°</span></div>
          </div>
      </div>

      <div class="bottom-controls">
          <!-- Throttle Controls (Left Side) -->
          <div class="control-group">
              <div class="trim-box">
                  <span class="trim-label">THROTTLE</span>
                  <div style="display:flex; gap:4px;">
                      <button class="hud-btn" id="btn-thr-dn">-</button>
                      <button class="hud-btn" id="btn-thr-up">+</button>
                  </div>
              </div>
          </div>

          <!-- Pitch & Yaw Trim Controls (Right Side) -->
          <div class="control-group">
              <div class="trim-box">
                  <span class="trim-label">PITCH TRIM</span>
                  <div style="display:flex; gap:4px;">
                      <button class="hud-btn" id="btn-ptrim-dn">▼</button>
                      <button class="hud-btn" id="btn-ptrim-up">▲</button>
                  </div>
              </div>
              <div class="trim-box">
                  <span class="trim-label">RUDDER TRIM</span>
                  <div style="display:flex; gap:4px;">
                      <button class="hud-btn" id="btn-ytrim-l">◄</button>
                      <button class="hud-btn" id="btn-ytrim-r">►</button>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <script>
        var container = document.getElementById('canvas-container');
        var scene, camera, renderer, ambientLight, sunLight;
        
        var CHUNK_SIZE = 1800;
        var CHUNK_SEGMENTS = 16; 
        var RENDER_RADIUS = 1; 
        var activeChunks = new Map();
        
        var airplane, propellerGroup;
        var airports = [];
        var activeAirportIdx = 1;

        // Flight Physics & Dynamics
        var physics = { 
            speed: 65,
            throttle: 0.5,
            pitchSpeed: 0,
            rollSpeed: 0,
            yawSpeed: 0,
            pitchTrim: 0.0,  // Dynamic pitch trim offset
            yawTrim: 0.0,    // Dynamic rudder trim offset
            maxSpeed: 140,
            minSpeed: 0,
            isGrounded: false
        };
        
        var clock = new THREE.Clock();
        var gestureInput = { x: 0, y: 0 };
        var isDragging = false, touchStartX = 0, touchStartY = 0;

        // Initial setup
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x71b4e6);
        scene.fog = new THREE.FogExp2(0x71b4e6, 0.0006);

        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(1000, 2000, 1000);
        scene.add(sunLight);

        // Procedural Height Formula
        function getGroundHeight(x, z) {
            return Math.sin(x * 0.002) * Math.cos(z * 0.002) * 60 + Math.sin(x * 0.008) * 10;
        }

        // Airport Runway Generator
        function createAirport(x, z, name) {
            var group = new THREE.Group();
            
            // Runway strip
            var rwGeo = new THREE.PlaneGeometry(120, 1600);
            var rwMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            var runway = new THREE.Mesh(rwGeo, rwMat);
            runway.rotateX(-Math.PI / 2);
            runway.position.y = getGroundHeight(x, z) + 0.5;
            group.add(runway);

            // Runway Beacon
            var beaconGeo = new THREE.CylinderGeometry(4, 4, 100, 8);
            var beaconMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
            var beacon = new THREE.Mesh(beaconGeo, beaconMat);
            beacon.position.set(0, 50, 0);
            group.add(beacon);

            group.position.set(x, 0, z);
            scene.add(group);

            return { x: x, z: z, name: name };
        }

        // Generate Origin and Destination Airports
        airports.push(createAirport(0, 0, "Origin Airfield"));
        airports.push(createAirport(0, 8000, "Regional Hub (K8)"));
        airports.push(createAirport(-7000, -4000, "Mountain Airstrip"));

        // Terrain Chunking
        function createChunk(cx, cz) {
            var chunkKey = cx + "," + cz;
            if (activeChunks.has(chunkKey)) return;

            var chunkGroup = new THREE.Group();
            var terrainGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_SEGMENTS, CHUNK_SEGMENTS);
            terrainGeo.rotateX(-Math.PI / 2);

            var posAttr = terrainGeo.attributes.position;
            var worldXOffset = cx * CHUNK_SIZE;
            var worldZOffset = cz * CHUNK_SIZE;

            for (var i = 0; i < posAttr.count; i++) {
                var worldX = posAttr.getX(i) + worldXOffset;
                var worldZ = posAttr.getZ(i) + worldZOffset;
                posAttr.setY(i, getGroundHeight(worldX, worldZ));
            }
            terrainGeo.computeVertexNormals();

            var terrainMat = new THREE.MeshLambertMaterial({ color: 0x3d7e48, flatShading: true });
            var terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
            chunkGroup.add(terrainMesh);

            chunkGroup.position.set(worldXOffset, 0, worldZOffset);
            scene.add(chunkGroup);
            activeChunks.set(chunkKey, chunkGroup);
        }

        function updateTerrain(pos) {
            var cx = Math.floor((pos.x + CHUNK_SIZE/2) / CHUNK_SIZE);
            var cz = Math.floor((pos.z + CHUNK_SIZE/2) / CHUNK_SIZE);

            for (var x = -RENDER_RADIUS; x <= RENDER_RADIUS; x++) {
                for (var z = -RENDER_RADIUS; z <= RENDER_RADIUS; z++) {
                    createChunk(cx + x, cz + z);
                }
            }
            for (const [key, value] of activeChunks.entries()) {
                var parts = key.split(',');
                if (Math.abs(Number(parts[0]) - cx) > RENDER_RADIUS + 1 || Math.abs(Number(parts[1]) - cz) > RENDER_RADIUS + 1) {
                    scene.remove(value);
                    activeChunks.delete(key);
                }
            }
        }

        // Airframe Assembly
        airplane = new THREE.Group();
        var bodyMat = new THREE.MeshLambertMaterial({ color: 0xdedede });
        var wingMat = new THREE.MeshLambertMaterial({ color: 0x1f65d6 });

        var body = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.5, 11, 8), bodyMat);
        body.rotateX(Math.PI / 2);
        airplane.add(body);

        var wings = new THREE.Mesh(new THREE.BoxGeometry(11, 0.15, 2.5), wingMat);
        wings.position.set(0, 0, 0.5);
        airplane.add(wings);

        var tailH = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.1, 1.2), wingMat);
        tailH.position.set(0, 0, -4.5);
        airplane.add(tailH);

        var tailV = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 1.2), wingMat);
        tailV.position.set(0, 1.1, -4.5);
        airplane.add(tailV);

        propellerGroup = new THREE.Group();
        var prop = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.2, 0.05), new THREE.MeshBasicMaterial({ color: 0x111111 }));
        propellerGroup.add(prop);
        propellerGroup.position.set(0, 0, 5.6);
        airplane.add(propellerGroup);

        airplane.position.set(0, 120, -200); 
        scene.add(airplane);

        // Touch Input Gestures (Flight Yoke Control)
        window.addEventListener('touchstart', function(e) {
            if(e.touches[0].clientX > window.innerWidth * 0.3) {
                isDragging = true;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
            if(!isDragging) return;
            let deltaX = e.touches[0].clientX - touchStartX;
            let deltaY = e.touches[0].clientY - touchStartY;
            let range = 100; 
            gestureInput.x = Math.max(-1, Math.min(1, deltaX / range));
            gestureInput.y = Math.max(-1, Math.min(1, -deltaY / range)); // Pitch inverted
        }, { passive: true });

        window.addEventListener('touchend', function() {
            isDragging = false;
            gestureInput.x = 0; gestureInput.y = 0;
        }, { passive: true });

        // HUD Control Binding
        document.getElementById('btn-thr-up').onclick = () => physics.throttle = Math.min(1.0, physics.throttle + 0.1);
        document.getElementById('btn-thr-dn').onclick = () => physics.throttle = Math.max(0.0, physics.throttle - 0.1);
        document.getElementById('btn-ptrim-up').onclick = () => physics.pitchTrim += 0.02;
        document.getElementById('btn-ptrim-dn').onclick = () => physics.pitchTrim -= 0.02;
        document.getElementById('btn-ytrim-r').onclick = () => physics.yawTrim += 0.02;
        document.getElementById('btn-ytrim-l').onclick = () => physics.yawTrim -= 0.02;

        // Simulator Physics Engine & Aerodynamics
        function updateFlight(delta) {
            if (!delta) return;

            // Target speed based on throttle
            var targetSpeed = physics.throttle * physics.maxSpeed;
            physics.speed = THREE.MathUtils.lerp(physics.speed, targetSpeed, 0.8 * delta);

            propellerGroup.rotateZ((10 + physics.speed * 0.3) * delta);

            // Gliding Dynamics: Cutting throttle smoothly trades pitch for glide attitude
            var idealSpeed = 70; 
            var speedRatio = physics.speed / idealSpeed;
            var naturalGlidePitch = (1.0 - speedRatio) * 0.15; // Pitch down on low speed, pitch up on overspeed

            // Yoke Pitch/Roll Rate Processing
            var pitchControl = (gestureInput.y * 0.7) + physics.pitchTrim - naturalGlidePitch;
            var rollControl = (gestureInput.x * 0.8);
            var yawControl = physics.yawTrim;

            airplane.rotateX(pitchControl * delta);
            airplane.rotateZ(-rollControl * delta);
            airplane.rotateY(-yawControl * delta);

            // Forward flight translation
            var forwardVector = new THREE.Vector3(0, 0, 1).applyQuaternion(airplane.quaternion);
            airplane.position.addScaledVector(forwardVector, physics.speed * delta);

            // Ground Collision Detection
            var groundHeight = getGroundHeight(airplane.position.x, airplane.position.z) + 3;
            if (airplane.position.y <= groundHeight) {
                airplane.position.y = groundHeight;
                physics.isGrounded = true;
            } else {
                physics.isGrounded = false;
            }

            // Natural Lift Engine
            if (!physics.isGrounded) {
                var lift = (physics.speed * 0.08) - 4.5;
                airplane.position.y += lift * delta;
            }

            updateTerrain(airplane.position);

            // Chase Camera Orientation
            var upVector = new THREE.Vector3(0, 1, 0).applyQuaternion(airplane.quaternion);
            camera.position.copy(airplane.position).addScaledVector(forwardVector, -32).addScaledVector(upVector, 8);
            camera.lookAt(airplane.position.clone().addScaledVector(forwardVector, 12));

            // Navigation Computation
            var dest = airports[activeAirportIdx];
            var dx = dest.x - airplane.position.x;
            var dz = dest.z - airplane.position.z;
            var distNM = (Math.sqrt(dx*dx + dz*dz) / 100).toFixed(1);
            var headingDeg = Math.round((Math.atan2(dx, dz) * (180 / Math.PI) + 360) % 360);

            // Switch airport objective when reaching waypoint
            if (distNM < 2.0) {
                activeAirportIdx = (activeAirportIdx + 1) % airports.length;
            }

            // Update Instrument HUD Display
            document.getElementById('val-spd').innerText = Math.round(physics.speed) + " kts";
            document.getElementById('val-alt').innerText = Math.round(airplane.position.y * 3.28) + " ft";
            document.getElementById('val-thr').innerText = Math.round(physics.throttle * 100) + "%";
            document.getElementById('nav-target').innerText = dest.name;
            document.getElementById('nav-dist').innerText = distNM + " nm";
            document.getElementById('nav-hdg').innerText = headingDeg + "°";
        }

        function animate() {
            requestAnimationFrame(animate);
            var delta = clock.getDelta();
            updateFlight(delta);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateTerrain(airplane.position);
        animate();
  </script>
</body>
</html>
