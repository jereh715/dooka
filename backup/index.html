<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Studio Player</title>
    <style>
        body { font-family: sans-serif; background: #0f111a; color: #fff; padding: 20px; text-align: center; }
        .player-card { background: #161925; padding: 20px; border-radius: 12px; border: 1px solid #232838; }
        .btn { background: #3886ff; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 5px; }
        .file-list { margin-top: 15px; text-align: left; background: #12141c; border-radius: 6px; max-height: 150px; overflow-y: auto; padding: 5px; }
        .file-item { padding: 8px; border-bottom: 1px solid #232838; cursor: pointer; font-size: 13px; }
        .file-item:hover { background: #222736; }
    </style>
</head>
<body>

    <div class="player-card">
        <h3>Sandbox Audio Deck</h3>
        <button class="btn" onclick="triggerNativeFileSelect()">📂 Import Track From Device</button>
        <button class="btn" style="background:#2c3143;" onclick="reloadTracks()">🔄 Sync Library View</button>
        
        <div class="file-list" id="track-container"></div>
        
        <h4 id="now-playing" style="color:#8a94a6; font-size:13px; margin-top:15px;">Selected: None</h4>
        <audio id="playback-engine" controls style="width:100%; margin-top:10px;"></audio>
    </div>

    <script>
        // 1. Invoke native Storage intent via Python API
        function triggerNativeFileSelect() {
            fetch('/api/hardware/storage_picker')
                .then(r => r.json())
                .then(() => setTimeout(reloadTracks, 5000)); // Delay allows user configuration choice
        }

        // 2. Fetch tracking details out of your standard file list API endpoint
        function reloadTracks() {
            fetch('/api/storage/list')
                .then(r => r.json())
                .then(data => {
                    let html = '';
                    if(!data.files || data.files.length === 0) {
                        html = '<div style="padding:10px; color:#697386; font-size:12px;">No music tracks found.</div>';
                    } else {
                        data.files.forEach(f => {
                            html += `<div class="file-item" onclick="streamTargetTrack('${f.name}')">🎵 ${f.name} (${f.size})</div>`;
                        });
                    }
                    document.getElementById('track-container').innerHTML = html;
                });
        }

        // 3. Direct streaming request straight into universal delivery system endpoint
        function streamTargetTrack(filename) {
            document.getElementById('now-playing').innerText = "Playing: " + filename;
            const player = document.getElementById('playback-engine');
            player.src = `/api/storage/raw/${encodeURIComponent(filename)}`;
            player.play();
        }

        reloadTracks();
    </script>
</body>
</html>
