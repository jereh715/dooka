<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player MiniApp Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f111a;
            color: #e1e4ed;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar for MiniApp Context -->
    <div class="bg-[#161925] border-b border-[#232838] px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-xl">📦</span>
            <div>
                <h1 class="text-sm font-bold text-white leading-tight">Media Hub Extension</h1>
                <p class="text-[11px] text-gray-400 font-mono">Running inside Workspace Overlay</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Native Status Refresher -->
            <button onclick="reloadPlayer()" class="text-xs bg-[#2c3143] hover:bg-[#3886ff] hover:text-white text-[#a2aab8] font-medium py-1.5 px-3 rounded transition-colors duration-150">
                🔄 Hard Reset
            </button>
        </div>
    </div>

    <!-- Embedded Modular Player Frame -->
    <div class="flex-1 w-full h-full bg-black relative">
        <iframe 
            id="player-frame" 
            src="/player/" 
            class="w-full h-full border-none absolute top-0 left-0" 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <script>
        function reloadPlayer() {
            const frame = document.getElementById('player-frame');
            if (frame) {
                frame.src = frame.src;
                console.log("[MINIAPP BRIDGE]: Refreshed underlying module layer.");
            }
        }

        const iframe = document.getElementById('player-frame');

        iframe.addEventListener('load', () => {
            try {
                const innerWin = iframe.contentWindow;

                if (innerWin && innerWin.selectMedia) {
                    // Save the original selectMedia function from player.py
                    const originalSelectMedia = innerWin.selectMedia;

                    // Intercept it with our wrapper
                    innerWin.selectMedia = function(name, uri) {
                        console.log("[MINIAPP] Intercepted track selection:", name);

                        // Fire the native notification endpoint directly using the clean 'name' parameter
                        fetch(`/api/hardware/notification?title=Now+Playing&msg=${encodeURIComponent(name)}`)
                            .catch(err => console.error("MiniApp bridge notification failed:", err));

                        // Call the original player logic so the music actually plays
                        return originalSelectMedia.apply(this, arguments);
                    };
                    
                    console.log("[MINIAPP BRIDGE]: Function hook injection successful.");
                }
            } catch (error) {
                console.error("Could not inject bridge hook into iframe context:", error);
            }
        });
    </script>
</body>
</html>
