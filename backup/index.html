<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synced Lyrics Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d0d; color: #e5e5e5; font-family: system-ui, -apple-system, sans-serif; }
        .lyric-line { transition: all 0.2s ease-in-out; }
        .lyric-line.active { color: #22c55e; font-weight: 700; transform: scale(1.03); origin: left; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between max-w-2xl mx-auto p-4 select-none">

    <header class="space-y-3">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white tracking-tight">Lyrics Search</h1>
            <div class="flex items-center gap-2">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
                <span id="status-text" class="text-xs text-gray-400">Initializing...</span>
            </div>
        </div>
        
        <div class="flex gap-2">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Song title or artist..." 
                class="flex-1 bg-[#1a1a1a] border border-[#333] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#22c55e]"
                onkeydown="if(event.key==='Enter') fetchLyrics()"
            />
            <button 
                onclick="fetchLyrics()" 
                id="search-btn"
                disabled
                class="bg-[#22c55e] hover:bg-[#16a34a] disabled:bg-gray-700 disabled:text-gray-400 text-black font-semibold text-sm px-5 py-2.5 rounded-lg transition"
            >
                Search
            </button>
        </div>
    </header>

    <main id="lyrics-container" class="flex-1 overflow-y-auto my-6 p-4 bg-[#141414] border border-[#262626] rounded-xl space-y-4">
        <div id="placeholder" class="text-center text-gray-500 text-sm mt-12">Waiting for engine dependencies...</div>
    </main>

    <footer id="sync-bar" class="hidden bg-[#1a1a1a] p-3 rounded-lg border border-[#333] space-y-2">
        <div class="flex justify-between text-xs text-gray-400">
            <span>Progress</span>
            <span id="time-display">0:00</span>
        </div>
        <input 
            type="range" 
            id="timeline" 
            value="0" 
            min="0" 
            max="200" 
            step="0.5" 
            class="w-full accent-[#22c55e]" 
            oninput="syncLyricsToTime(parseFloat(this.value))" 
        />
    </footer>

<script>
// Reliable route resolution targeting the runner API
const pathSegments = window.location.pathname.split('/').filter(Boolean);
const APP_NAME = pathSegments.length > 0 ? pathSegments[pathSegments.length - 1] : 'backup';
const API_BASE = `/runner/api/${APP_NAME}`;

let parsedLyrics = [];
let isEngineReady = false;

async function monitorEngine() {
    const dot = document.getElementById("status-dot");
    const text = document.getElementById("status-text");
    const btn = document.getElementById("search-btn");
    const placeholder = document.getElementById("placeholder");

    try {
        const res = await fetch(`${API_BASE}/get_install_status`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const responseData = await res.json();
        const data = responseData.data || responseData;

        if (data.ready) {
            isEngineReady = true;
            dot.className = "w-2.5 h-2.5 rounded-full bg-[#22c55e]";
            text.textContent = "Ready";
            btn.disabled = false;
            if (placeholder && placeholder.textContent.includes("Waiting")) {
                placeholder.textContent = "Engine ready. Search for a song to load lyrics.";
            }
        } else if (data.installing) {
            dot.className = "w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse";
            text.textContent = data.message || "Installing dependencies...";
            btn.disabled = true;
            setTimeout(monitorEngine, 2000);
        } else if (data.error) {
            dot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
            text.textContent = "Error loading libs";
            btn.disabled = true;
        }
    } catch (e) {
        dot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
        text.textContent = "Disconnected";
        setTimeout(monitorEngine, 3000);
    }
}
monitorEngine();

async function fetchLyrics() {
    if (!isEngineReady) return;

    const input = document.getElementById("search-input");
    const btn = document.getElementById("search-btn");
    const container = document.getElementById("lyrics-container");
    const syncBar = document.getElementById("sync-bar");

    const query = input.value.trim();
    if (!query) return;

    btn.disabled = true;
    container.innerHTML = `<div class="text-center text-gray-400 text-sm mt-12">Searching lyrics for "${query}"...</div>`;

    try {
        const response = await fetch(`${API_BASE}/get_lyrics?query=${encodeURIComponent(query)}`);
        const res = await response.json();
        const data = res.data || res;

        if (data.success) {
            if (data.is_synced && data.parsed.length > 0) {
                parsedLyrics = data.parsed;
                renderSyncedLyrics(parsedLyrics);
                setupTimeline(parsedLyrics);
                syncBar.classList.remove("hidden");
            } else {
                syncBar.classList.add("hidden");
                container.innerHTML = `<pre class="whitespace-pre-wrap font-sans text-sm text-gray-300 p-2">${data.raw}</pre>`;
            }
        } else {
            container.innerHTML = `<div class="text-center text-gray-500 text-sm mt-12">${data.message || "No lyrics found."}</div>`;
            syncBar.classList.add("hidden");
        }
    } catch (e) {
        container.innerHTML = `<div class="text-center text-red-500 text-sm mt-12">Error communicating with engine.</div>`;
    } finally {
        btn.disabled = false;
    }
}

function renderSyncedLyrics(lines) {
    const container = document.getElementById("lyrics-container");
    container.innerHTML = "";
    lines.forEach((line, index) => {
        const div = document.createElement("div");
        div.id = `line-${index}`;
        div.className = "lyric-line text-gray-400 text-base py-1 cursor-pointer hover:text-white";
        div.textContent = line.text;
        div.onclick = () => {
            document.getElementById("timeline").value = line.time;
            syncLyricsToTime(line.time);
        };
        container.appendChild(div);
    });
}

function setupTimeline(lines) {
    const timeline = document.getElementById("timeline");
    timeline.max = lines[lines.length - 1].time + 5;
    timeline.value = 0;
    document.getElementById("time-display").textContent = "0:00";
}

function syncLyricsToTime(currentTime) {
    const m = Math.floor(currentTime / 60);
    const s = Math.floor(currentTime % 60);
    document.getElementById("time-display").textContent = `${m}:${s < 10 ? '0' : ''}${s}`;

    let activeIndex = -1;
    for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) activeIndex = i;
        else break;
    }

    parsedLyrics.forEach((_, idx) => {
        const el = document.getElementById(`line-${idx}`);
        if (el) {
            if (idx === activeIndex) {
                el.classList.add("active");
                el.scrollIntoView({ behavior: "smooth", block: "center" });
            } else {
                el.classList.remove("active");
            }
        }
    });
}
</script>
</body>
</html>
