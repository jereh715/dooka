<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operat Asset Viewer Workspace</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f111a;
            color: #e1e4ed;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            color: #fff;
            border-bottom: 1px solid #232838;
            padding-bottom: 10px;
            font-weight: 400;
        }
        .btn {
            background: #3886ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(56, 134, 255, 0.15);
        }
        .btn:hover { background: #2a75e6; }
        
        .status-box {
            background: #161925;
            border-left: 4px solid #3886ff;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 20px;
            color: #7dd3fc;
            word-break: break-all;
        }

        .preview-card {
            background: #1a1d29;
            border: 1px solid #232838;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .preview-card h3 {
            margin-top: 0;
            font-size: 13px;
            color: #8a94a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .media-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0c13;
            border-radius: 6px;
            padding: 10px;
            min-height: 60px;
        }

        img.preview-target {
            max-width: 100%;
            max-height: 300px;
            border-radius: 4px;
            object-fit: contain;
        }
        audio.preview-target {
            width: 100%;
        }

        .meta-details {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Operat Media Pipeline Asset Host</h2>
        
        <button class="btn" onclick="launchDevicePicker()">📂 Invoke Storage Content Intent</button>
        
        <div id="diagnostic-log" class="status-box">Awaiting operational storage picker command execution...</div>

        <div class="preview-card">
            <h3>🖼️ Rendered Image Canvas</h3>
            <div class="media-container" id="image-wrapper">
                <span style="color: #475569; font-size: 13px;">No active bitmap cached in buffer stack.</span>
            </div>
            <div class="meta-details" id="image-meta"></div>
        </div>

        <div class="preview-card">
            <h3>🎵 Audio Playback Channel</h3>
            <div class="media-container" id="audio-wrapper">
                <span style="color: #475569; font-size: 13px;">No digital audio track active in buffer stack.</span>
            </div>
            <div class="meta-details" id="audio-meta"></div>
        </div>
    </div>

    <script>
        const diagnosticLog = document.getElementById('diagnostic-log');
        let pollingInterval = null;

        // 1. Fire the native hardware storage access intent endpoint
        function launchDevicePicker() {
            diagnosticLog.innerText = "Dispatching Intent action picker hook...";
            fetch('/api/hardware/storage_picker')
                .then(res => res.json())
                .then(data => {
                    diagnosticLog.innerText = "Native content picker visible. Initializing asynchronous polling tracker...";
                    startCacheRegistryScan();
                })
                .catch(err => {
                    diagnosticLog.innerText = "Hardware intent dispatch failure: " + err;
                });
        }

        // 2. Poll the state array checking for elements loaded into picked_file_cache
        function startCacheRegistryScan() {
            if (pollingInterval) clearInterval(pollingInterval);
            
            let pollCounter = 0;
            pollingInterval = setInterval(() => {
                pollCounter++;
                diagnosticLog.innerText = `Scanning storage list api metrics... (Cycle ${pollCounter})`;
                
                fetch('/api/storage/list')
                    .then(res => res.json())
                    .then(data => {
                        if (data.files && data.files.length > 0) {
                            // Target the most recently inserted item inside the registry cache array
                            const latestAsset = data.files[data.files.length - 1];
                            
                            // Check if the file contains completed byte streams or an active base64 signature string
                            if (latestAsset.base64_data || latestAsset.name) {
                                diagnosticLog.innerText = `Discovered dynamic asset reference context! Binding payload stream...`;
                                clearInterval(pollingInterval);
                                renderMediaElement(latestAsset);
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Storage descriptor endpoint access block:", err);
                    });

                // Automated execution safe safety cutoff boundary threshold limit (45 seconds)
                if (pollCounter > 30) {
                    clearInterval(pollingInterval);
                    diagnosticLog.innerText = "Scanning framework sequence timed out. Re-fire selection context intent.";
                }
            }, 1500);
        }

        // 3. Dynamically append corresponding nodes onto DOM layers safely referencing back via clean binary or base64 streams
        function renderMediaElement(asset) {
            const isImage = asset.mime.startsWith('image/');
            const isAudio = asset.mime.startsWith('audio/');
            
            // Prefer using the streaming direct raw content URL path loop fallback for fallback compatibility assurance
            const sourceStreamUrl = asset.base64_data ? asset.base64_data : `/api/storage/raw/${encodeURIComponent(asset.name)}`;

            if (isImage) {
                const imgNode = document.createElement('img');
                imgNode.className = 'preview-target';
                imgNode.src = sourceStreamUrl;
                
                const wrapper = document.getElementById('image-wrapper');
                wrapper.innerHTML = '';
                wrapper.appendChild(imgNode);
                
                document.getElementById('image-meta').innerText = 
                    `Identifier: ${asset.name}\nMIME Class: ${asset.mime}\nAllocated Allocation: ${asset.size}`;
                
                diagnosticLog.innerText = `✅ Image component canvas mounted cleanly via stream context.`;
            } 
            else if (isAudio) {
                const audioNode = document.createElement('audio');
                audioNode.className = 'preview-target';
                audioNode.controls = true;
                audioNode.src = sourceStreamUrl;
                
                const wrapper = document.getElementById('audio-wrapper');
                wrapper.innerHTML = '';
                wrapper.appendChild(audioNode);
                
                document.getElementById('audio-meta').innerText = 
                    `Identifier: ${asset.name}\nMIME Class: ${asset.mime}\nAllocated Allocation: ${asset.size}`;
                
                diagnosticLog.innerText = `✅ Audio track audio channel layer initialized cleanly via stream context.`;
            } 
            else {
                diagnosticLog.innerText = `Asset parsed safely, but MIME signature structure matches no preview layer elements ("${asset.mime}").`;
            }
        }
    </script>
</body>
</html>
