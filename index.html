<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumia HTML Inspector</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 font-sans">

    <!-- App Header -->
    <div class="max-w-xl mx-auto space-y-4">
        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
            <h1 class="text-xl font-bold text-orange-500 flex items-center gap-2">
                📦 Jumia HTML Dumper
            </h1>
            <span class="text-xs bg-orange-950 text-orange-400 border border-orange-800 px-2 py-0.5 rounded-full font-mono">
                Raw Inspector
            </span>
        </div>

        <!-- Search Input Form -->
        <div class="flex gap-2">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search term..." 
                value="phones"
                class="flex-1 bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500"
                onkeypress="if(event.key === 'Enter') dumpHtml()"
            />
            <button 
                onclick="dumpHtml()" 
                id="search-btn"
                class="bg-orange-600 hover:bg-orange-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors">
                Dump HTML
            </button>
        </div>

        <!-- Status & Results Container -->
        <div id="results-container" class="space-y-3 pt-2">
            <div class="text-center py-8 text-gray-500 text-sm">
                Click "Dump HTML" to fetch Jumia response and preview raw text.
            </div>
        </div>
    </div>

    <!-- JavaScript Bridge Connection -->
    <script>
        const pathSegments = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
        const APP_NAME = pathSegments[pathSegments.length - 1] || 'sys_diag';

        async function dumpHtml() {
            const queryInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const container = document.getElementById('results-container');
            const query = queryInput.value.trim();

            if (!query) return;

            searchBtn.disabled = true;
            searchBtn.classList.add('opacity-50');
            container.innerHTML = `
                <div class="p-4 bg-gray-900/50 border border-gray-800 rounded-lg text-center space-y-2">
                    <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-orange-500 border-t-transparent"></div>
                    <p class="text-xs text-gray-400">Fetching raw HTML from Jumia Kenya...</p>
                </div>
            `;

            try {
                const response = await fetch(`/runner/api/${APP_NAME}/scrape_jumia`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const result = await response.json();
                const payload = result.data || result;

                if (payload.success) {
                    container.innerHTML = `
                        <div class="p-3 bg-gray-900 border border-gray-800 rounded-lg space-y-2 text-xs">
                            <div class="flex justify-between text-gray-400 border-b border-gray-800 pb-2">
                                <span>Bytes: <strong class="text-white">${payload.html_length}</strong></span>
                                <span class="text-orange-400 font-mono">Saved to local file</span>
                            </div>
                            <div class="text-gray-400 break-all font-mono text-[10px]">
                                Path: ${escapeHtml(payload.saved_to)}
                            </div>
                        </div>

                        <div class="space-y-1">
                            <div class="text-xs text-gray-400 font-medium">First 1,000 Characters Preview:</div>
                            <pre class="p-3 bg-black/80 border border-gray-800 rounded-lg text-green-400 font-mono text-xs overflow-x-auto whitespace-pre-wrap max-h-96">${escapeHtml(payload.preview)}</pre>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="p-4 bg-red-950/30 border border-red-900/50 rounded-lg text-red-400 text-xs font-mono">
                            ⚠️ Error: ${escapeHtml(payload.error || 'Unknown failure')}
                        </div>
                    `;
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="p-4 bg-red-950/30 border border-red-900/50 rounded-lg text-red-400 text-xs font-mono">
                        ⚠️ Network Error: ${escapeHtml(err.message)}
                    </div>
                `;
            } finally {
                searchBtn.disabled = false;
                searchBtn.classList.remove('opacity-50');
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }
    </script>
</body>
</html>
