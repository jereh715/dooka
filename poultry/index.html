<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Notifier Mini-App</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f111a; 
            color: #e1e4ed; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 80vh;
        }
        .app-card { 
            background: #161925; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #232838; 
            max-width: 380px; 
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h3 { 
            margin-top: 0; 
            color: #fff; 
            font-size: 20px;
            font-weight: 500;
        }
        p {
            color: #8a94a6;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn { 
            background: #3886ff; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
            transition: background 0.2s;
        }
        .btn:active {
            background: #2266dd;
        }
        .btn:disabled {
            background: #2c3143;
            color: #697386;
            cursor: not-allowed;
        }
        .console-log { 
            margin-top: 20px; 
            background: #12141c; 
            padding: 12px; 
            border-radius: 6px; 
            font-family: monospace; 
            font-size: 12px; 
            text-align: left; 
            border-left: 3px solid #3886ff;
            word-break: break-all;
            min-height: 40px;
        }
        .success { border-left-color: #00e676; color: #00e676; }
        .error { border-left-color: #ff5252; color: #ff5252; }
    </style>
</head>
<body>

    <div class="app-card">
        <h3>📍 Location Interceptor</h3>
        <p>Queries native hardware GPS coordinates via Python, then broadcasts an OS-level notification banner.</p>
        
        <button id="action-btn" class="btn" onclick="fetchAndNotifyLocation()">Locate & Notify Device</button>
        
        <div id="console-output" class="console-log">Awaiting command pipeline...</div>
    </div>

    <script>
        const consoleOutput = document.getElementById('console-output');
        const actionBtn = document.getElementById('action-btn');

        function updateConsole(text, type = '') {
            consoleOutput.innerText = text;
            consoleOutput.className = 'console-log ' + type;
        }

        function fetchAndNotifyLocation() {
            // Lock UI during execution
            actionBtn.disabled = true;
            updateConsole("🛰️ Requesting hardware GPS coordinates from Python...");

            // Step 1: Query the updated location endpoint
            fetch('/api/hardware/location')
                .then(response => response.json())
                .then(locationData => {
                    if (locationData.error) {
                        throw new Error(locationData.error);
                    }

                    // Extract text info (Works natively or with your mock fallback string format)
                    const locationText = locationData.message || `Coordinates discovered successfully.`;
                    updateConsole(`✅ Location found!\n${locationText}\n\n🔔 Handing off context to Android Notifications...`, 'success');

                    // Step 2: Push location data string to notification endpoint
                    const encodedTitle = encodeURIComponent("📍 Device Located Natively");
                    const encodedMsg = encodeURIComponent(locationText);

                    return fetch(`/api/hardware/notification?title=${encodedTitle}&msg=${encodedMsg}`);
                })
                .then(response => response.json())
                .then(notificationData => {
                    if (notificationData.error) {
                        throw new Error(notificationData.error);
                    }
                    // Complete execution successfully
                    updateConsole("🔔 Notification dispatched successfully straight to the Android notification drawer!", "success");
                    actionBtn.disabled = false;
                })
                .catch(err => {
                    // Handle failures smoothly
                    updateConsole(`❌ Pipeline failed: ${err.message}`, "error");
                    actionBtn.disabled = false;
                });
        }
    </script>
</body>
</html>
