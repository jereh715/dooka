<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen justify-between">

    <div class="space-y-4">
        <!-- Header -->
        <div class="border-b border-gray-800 pb-3">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                ⚡ Operat Diagnostic Tool
            </h1>
            <p class="text-xs text-gray-500">Full-Stack Python + Web Integration</p>
        </div>

        <!-- System Information Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-semibold text-sm text-blue-400">🖥️ Host Environment</h2>
                <button onclick="fetchSysInfo()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded transition">
                    Refresh
                </button>
            </div>
            <div id="sys-info-content" class="text-xs space-y-1 text-gray-300 font-mono">
                <p class="text-gray-600">Loading system specs...</p>
            </div>
        </div>

        <!-- Storage Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-semibold text-sm text-green-400">💾 Storage Metrics</h2>
                <button onclick="fetchStorageStats()" class="text-xs bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded transition">
                    Scan
                </button>
            </div>
            <div id="storage-content" class="text-xs space-y-1 text-gray-300 font-mono">
                <p class="text-gray-600">Click Scan to query disk...</p>
            </div>
        </div>

        <!-- Interactive Python SHA256 Form -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4">
            <h2 class="font-semibold text-sm text-purple-400 mb-2">🔐 Backend Hasher</h2>
            <div class="flex gap-2 mb-2">
                <input id="hash-input" type="text" placeholder="Enter string..." 
                    class="flex-1 bg-gray-950 border border-gray-800 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500">
                <button onclick="runHash()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded text-xs transition">
                    Hash
                </button>
            </div>
            <div id="hash-result" class="text-xs text-gray-400 font-mono break-all hidden"></div>
        </div>
    </div>

    <!-- Footer -->
    <div class="text-center text-[10px] text-gray-600 mt-6 border-t border-gray-900 pt-2">
        Powered by <span class="text-gray-400 font-semibold">runner.py</span>
    </div>

    <script>
        // Automatically extracts the current app folder name from URL path
        // Example: "/mini_apps/testa/index.html" -> APP_NAME becomes "testa"
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const APP_NAME = pathSegments.length >= 2 ? pathSegments[1] : "testa";

        async function fetchSysInfo() {
            const container = document.getElementById('sys-info-content');
            container.innerHTML = '<p class="text-gray-500">Querying backend...</p>';
            try {
                const response = await fetch(`/runner/api/${APP_NAME}/get_sys_info`);
                const res = await response.json();
                
                if (res.success) {
                    const data = res.data;
                    container.innerHTML = `
                        <p><span class="text-gray-500">Platform:</span> ${data.platform}</p>
                        <p><span class="text-gray-500">Python:</span> ${data.python_version}</p>
                        <p><span class="text-gray-500">CPU:</span> ${data.processor}</p>
                    `;
                } else {
                    container.innerHTML = `<p class="text-red-400">${res.error}</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p class="text-red-400">Failed to connect to runner API.</p>`;
            }
        }

        async function fetchStorageStats() {
            const container = document.getElementById('storage-content');
            container.innerHTML = '<p class="text-gray-500">Analyzing volume...</p>';
            try {
                const response = await fetch(`/runner/api/${APP_NAME}/get_storage_stats`);
                const res = await response.json();

                if (res.success && !res.data.error) {
                    const d = res.data;
                    container.innerHTML = `
                        <p><span class="text-gray-500">Used:</span> ${d.used_gb} GB / ${d.total_gb} GB (${d.used_percent}%)</p>
                        <p><span class="text-gray-500">Free:</span> ${d.free_gb} GB</p>
                    `;
                } else {
                    container.innerHTML = `<p class="text-yellow-500">${res.data.error || res.error}</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p class="text-red-400">Failed to reach storage endpoint.</p>`;
            }
        }

        async function runHash() {
            const inputVal = document.getElementById('hash-input').value;
            const resultBox = document.getElementById('hash-result');

            if (!inputVal) return;

            try {
                const response = await fetch(`/runner/api/${APP_NAME}/calculate_hash`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input_text: inputVal })
                });
                const res = await response.json();

                if (res.success && res.data.sha256) {
                    resultBox.classList.remove('hidden');
                    resultBox.innerHTML = `
                        <span class="text-purple-400">SHA256:</span><br>
                        ${res.data.sha256}
                    `;
                }
            } catch (err) {
                console.error("Hashing failed:", err);
            }
        }

        // Auto-fetch environment information on app startup
        window.onload = fetchSysInfo;
    </script>
</body>
</html>
