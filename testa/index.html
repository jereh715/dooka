<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Data YouTube Playlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

    <div class="max-w-xl mx-auto w-full space-y-4">

        <!-- Header -->
        <div class="border-b border-gray-800 pb-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-white">🎵 Low-Data Player</h1>
                <p class="text-xs text-gray-500">Auto-queue & ~1MB Low-Bitrate Streams</p>
            </div>
            <div id="status-badge" class="text-xs px-2 py-1 rounded bg-gray-800 text-gray-400">
                Checking...
            </div>
        </div>

        <!-- Search Bar -->
        <div class="flex gap-2">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search track to add..." 
                class="bg-gray-900 border border-gray-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-green-500 w-full"
                onkeydown="if(event.key === 'Enter') addTrackToQueue()"
            />
            <button 
                id="add-btn"
                onclick="addTrackToQueue()" 
                class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-sm font-semibold text-white transition-colors whitespace-nowrap"
            >
                + Add
            </button>
        </div>

        <!-- Active Player -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 space-y-3">
            <div id="player-status" class="text-xs text-gray-500 text-center py-2">
                Queue is empty.
            </div>

            <div id="now-playing-card" class="hidden flex items-center gap-3">
                <img id="track-thumb" src="" class="w-12 h-12 object-cover rounded bg-gray-800" />
                <div class="overflow-hidden">
                    <h2 id="track-title" class="text-white font-semibold text-sm truncate">---</h2>
                    <p id="track-artist" class="text-xs text-gray-400 truncate">---</p>
                </div>
            </div>

            <audio id="audio-player" controls class="w-full">
                Your browser does not support audio playback.
            </audio>
        </div>

        <!-- Playlist Queue -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 space-y-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 border-b border-gray-800 pb-2">
                Up Next (<span id="queue-count">0</span>)
            </h3>
            <div id="queue-list" class="space-y-2 text-sm"></div>
        </div>

    </div>

<script>
const APP_NAME = "testa";
let playlist = [];
let currentTrackIndex = -1;

const audioPlayer = document.getElementById("audio-player");

// Autoplay next track when current one finishes
audioPlayer.addEventListener("ended", () => {
    playNextTrack();
});

async function checkInstallStatus() {
    const badge = document.getElementById("status-badge");
    try {
        const response = await fetch(`/runner/api/${APP_NAME}/get_install_status`);
        const res = await response.json();
        const data = res.data || res;

        if (data.is_installed) {
            badge.className = "text-xs px-2 py-1 rounded bg-green-950 text-green-400 border border-green-800";
            badge.textContent = "yt-dlp Ready";
        } else if (data.is_installing) {
            badge.className = "text-xs px-2 py-1 rounded bg-yellow-950 text-yellow-400 border border-yellow-800 animate-pulse";
            badge.textContent = "Installing...";
        }
    } catch (e) {
        console.error("Status error", e);
    }
}
setInterval(checkInstallStatus, 3000);
checkInstallStatus();

async function addTrackToQueue() {
    const input = document.getElementById("search-input");
    const query = input.value.trim();
    const btn = document.getElementById("add-btn");
    const status = document.getElementById("player-status");

    if (!query) return;

    btn.disabled = true;
    btn.classList.add("opacity-50");
    status.textContent = "Extracting low-data stream (~1MB)...";

    try {
        const response = await fetch(`/runner/api/${APP_NAME}/search_and_stream?query=${encodeURIComponent(query)}`);
        const res = await response.json();
        const data = res.data || res;

        if (data.stream_url) {
            playlist.push(data);
            input.value = "";
            status.textContent = "Track added to queue.";
            renderQueue();

            // If nothing is playing, play immediately
            if (currentTrackIndex === -1) {
                playTrack(0);
            }
        } else {
            status.textContent = res.error || "Could not find stream.";
        }
    } catch (e) {
        status.textContent = "Failed to communicate with backend.";
    } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-50");
    }
}

function renderQueue() {
    const list = document.getElementById("queue-list");
    document.getElementById("queue-count").textContent = playlist.length;
    list.innerHTML = "";

    playlist.forEach((track, idx) => {
        const isCurrent = idx === currentTrackIndex;
        const item = document.createElement("div");
        item.className = `flex justify-between items-center p-2 rounded text-xs ${isCurrent ? 'bg-green-950 text-green-300 border border-green-800' : 'bg-gray-800/50 text-gray-300'}`;
        
        item.innerHTML = `
            <div class="truncate cursor-pointer flex-1 mr-2" onclick="playTrack(${idx})">
                <span class="font-bold">${idx + 1}.</span> ${track.title}
            </div>
            <button onclick="removeTrack(${idx})" class="text-red-400 hover:text-red-300 px-1">✕</button>
        `;
        list.appendChild(item);
    });
}

function playTrack(index) {
    if (index < 0 || index >= playlist.length) return;

    currentTrackIndex = index;
    const track = playlist[index];

    document.getElementById("now-playing-card").classList.remove("hidden");
    document.getElementById("track-title").textContent = track.title;
    document.getElementById("track-artist").textContent = track.artist;
    document.getElementById("track-thumb").src = track.thumbnail;

    audioPlayer.src = track.stream_url;
    audioPlayer.play().catch(e => console.warn("Autoplay blocked:", e));

    renderQueue();
}

function playNextTrack() {
    if (currentTrackIndex + 1 < playlist.length) {
        playTrack(currentTrackIndex + 1);
    } else {
        document.getElementById("player-status").textContent = "Reached end of playlist.";
    }
}

function removeTrack(index) {
    playlist.splice(index, 1);
    if (currentTrackIndex === index) {
        if (playlist.length > 0) {
            playTrack(Math.min(index, playlist.length - 1));
        } else {
            currentTrackIndex = -1;
            audioPlayer.pause();
            document.getElementById("now-playing-card").classList.add("hidden");
        }
    } else if (currentTrackIndex > index) {
        currentTrackIndex--;
    }
    renderQueue();
}
</script>

</body>
</html>
