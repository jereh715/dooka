<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Streamer</title>
<style>
  :root { --bg:#0b0d14; --card:#151927; --line:#262c42; --text:#e8eaf3; --dim:#8b92ad; --accent:#6c8cff; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:14px; padding-top:20px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .row { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; min-width:0; }
  button { padding:12px 16px; border-radius:12px; border:0; background:var(--accent); color:#fff; font-weight:600; font-size:15px; }
  button:disabled { opacity:.5; }
  #status { margin:12px 2px; font-size:13px; color:var(--dim); min-height:18px; }
  #status.err { color:var(--bad); }
  .item { display:flex; gap:10px; align-items:center; padding:8px; border-radius:12px; background:var(--card); margin-bottom:8px; }
  .item img { width:84px; height:48px; object-fit:cover; border-radius:8px; background:#222; flex:none; }
  .item .t { font-size:14px; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item .m { font-size:12px; color:var(--dim); margin-top:2px; }
  #player { position:sticky; bottom:0; margin-top:14px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:16px; display:none; }
  #player.on { display:block; }
  #np { font-size:14px; font-weight:600; margin-bottom:2px; }
  #info { font-size:11px; color:var(--dim); margin-bottom:8px; }
  audio { width:100%; }
</style>
</head>
<body>
  <h1>🎧 Audio Streamer</h1>
  <div class="row">
    <input id="q" placeholder="Search, or paste a link" autocomplete="off">
    <button id="go">Go</button>
  </div>
  <div id="status"></div>
  <div id="results"></div>

  <div id="player">
    <div id="np"></div>
    <div id="info"></div>
    <audio id="audio" controls preload="auto"></audio>
  </div>

<script>
// Runner blueprint is mounted at /runner, and the app id comes from the URL
// (/mini_apps/<app_id>/index.html), so this works under any folder name.
const APP = location.pathname.split('/')[2];
const API = `/runner/api/${APP}/`;
const $ = id => document.getElementById(id);
const statusEl = $('status');

function setStatus(msg, err) { statusEl.textContent = msg || ''; statusEl.className = err ? 'err' : ''; }

async function call(action, body) {
  const res = await fetch(API + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.success === false) {
    // 422 = missing package; the injected runtime shows the install prompt.
    throw new Error(json.error || ('HTTP ' + res.status));
  }
  return json.data;
}

function isUrl(s) { return /^https?:\/\//i.test(s); }

async function run() {
  const text = $('q').value.trim();
  if (!text) return;
  $('go').disabled = true;
  try {
    if (isUrl(text)) {
      await play(text);
    } else {
      setStatus('Searching…');
      const data = await call('search', { query: text });
      if (data.error) throw new Error(data.error);
      render(data.results);
      setStatus(data.results.length ? 'Tap a result to play' : 'No results');
    }
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    $('go').disabled = false;
  }
}

function render(items) {
  const box = $('results');
  box.innerHTML = '';
  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = '<img alt=""><div><div class="t"></div><div class="m"></div></div>';
    if (it.thumbnail) el.querySelector('img').src = it.thumbnail;
    el.querySelector('.t').textContent = it.title;
    el.querySelector('.m').textContent = [it.channel, it.duration].filter(Boolean).join(' • ');
    el.onclick = () => play(it.url).catch(e => setStatus(e.message, true));
    box.appendChild(el);
  });
}

async function play(url) {
  setStatus('Resolving stream…');
  const t0 = performance.now();
  const d = await call('resolve', { url });
  if (d.error) throw new Error(d.error);

  const audio = $('audio');
  audio.src = d.stream_url;
  $('player').classList.add('on');
  $('np').textContent = d.title || 'Unknown title';
  $('info').textContent =
    `${d.channel || ''} • ${d.ext || '?'} @ ${d.abr ? Math.round(d.abr) + 'kbps' : '?'} • ` +
    `client: ${d.client} • resolved in ${d.resolve_seconds}s`;
  try {
    await audio.play();
    setStatus(`Playing (total ${((performance.now() - t0) / 1000).toFixed(1)}s to start)`);
  } catch (e) {
    setStatus('Resolved, but playback was blocked: ' + e.message + ' (tap play)', true);
  }
}

$('audio').addEventListener('error', () => {
  const c = $('audio').error;
  setStatus('Audio element error' + (c ? ` (code ${c.code})` : '') + ' – the stream URL may be rejected or expired', true);
});
$('go').onclick = run;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
