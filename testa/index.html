<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Stream & Silent Download Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

    <div class="max-w-xl mx-auto w-full space-y-4">

        <!-- Header -->
        <div class="border-b border-gray-800 pb-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-white">⚡ Instant Stream & Auto-Vault</h1>
                <p class="text-xs text-gray-500">Streams instantly + saves low-data copy silently</p>
            </div>
            <div id="status-badge" class="text-xs px-2 py-1 rounded bg-gray-800 text-gray-400">
                Checking...
            </div>
        </div>

        <!-- Search Bar -->
        <div class="flex gap-2">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search song to play & save..." 
                class="bg-gray-900 border border-gray-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-green-500 w-full"
                onkeydown="if(event.key === 'Enter') addAndPlayTrack()"
            />
            <button 
                id="add-btn"
                onclick="addAndPlayTrack()" 
                class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-sm font-semibold text-white transition-colors whitespace-nowrap"
            >
                ▶ Play
            </button>
        </div>

        <!-- Active Player -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 space-y-3">
            <div id="player-status" class="text-xs text-gray-500 text-center py-2">
                Queue is empty.
            </div>

            <div id="now-playing-card" class="hidden flex items-center gap-3">
                <img id="track-thumb" src="" class="w-12 h-12 object-cover rounded bg-gray-800" />
                <div class="overflow-hidden flex-1">
                    <h2 id="track-title" class="text-white font-semibold text-sm truncate">---</h2>
                    <p id="track-artist" class="text-xs text-gray-400 truncate">---</p>
                </div>
                <div id="playback-source" class="text-[10px] px-2 py-1 rounded bg-gray-800 text-gray-400 whitespace-nowrap">
                    ---
                </div>
            </div>

            <audio id="audio-player" controls class="w-full">
                Your browser does not support audio playback.
            </audio>
        </div>

        <!-- Playlist -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 space-y-2">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">
                    Playlist (<span id="queue-count">0</span>)
                </h3>
            </div>
            <div id="queue-list" class="space-y-2 text-sm"></div>
        </div>

    </div>

<script>
const APP_NAME = "testa";
const STORAGE_KEY = "hybrid_playlist_vault";

let playlist = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentTrackIndex = -1;

const audioPlayer = document.getElementById("audio-player");

audioPlayer.addEventListener("ended", () => {
    playNextTrack();
});

function savePlaylist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(playlist));
    renderQueue();
}

async function checkInstallStatus() {
    const badge = document.getElementById("status-badge");
    try {
        const response = await fetch(`/runner/api/${APP_NAME}/get_install_status`);
        const res = await response.json();
        const data = res.data || res;

        if (data.is_installed) {
            badge.className = "text-xs px-2 py-1 rounded bg-green-950 text-green-400 border border-green-800";
            badge.textContent = "yt-dlp Ready";
        } else if (data.is_installing) {
            badge.className = "text-xs px-2 py-1 rounded bg-yellow-950 text-yellow-400 border border-yellow-800 animate-pulse";
            badge.textContent = "Installing...";
        }
    } catch (e) {
        console.error("Status error", e);
    }
}
setInterval(checkInstallStatus, 3000);
checkInstallStatus();

async function addAndPlayTrack() {
    const input = document.getElementById("search-input");
    const query = input.value.trim();
    const btn = document.getElementById("add-btn");
    const status = document.getElementById("player-status");

    if (!query) return;

    btn.disabled = true;
    btn.classList.add("opacity-50");
    status.textContent = "Fetching instant stream link...";

    try {
        const response = await fetch(`/runner/api/${APP_NAME}/stream_and_trigger_download?query=${encodeURIComponent(query)}`);
        const res = await response.json();
        const data = res.data || res;

        if (data.success) {
            const trackObj = {
                query: query,
                id: data.id,
                title: data.title,
                artist: data.artist,
                thumbnail: data.thumbnail,
                stream_url: data.stream_url,
                file_name: data.file_name,
                is_saved: data.is_saved
            };

            playlist.push(trackObj);
            input.value = "";
            savePlaylist();

            // Start background polling to check when silent download finishes
            if (!trackObj.is_saved) {
                pollDownloadStatus(playlist.length - 1);
            }

            if (currentTrackIndex === -1) {
                playTrack(playlist.length - 1);
            }
        } else {
            status.textContent = res.error || "Could not fetch track.";
        }
    } catch (e) {
        status.textContent = "Backend connection error.";
    } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-50");
    }
}

function pollDownloadStatus(index) {
    const pollInterval = setInterval(async () => {
        if (!playlist[index]) {
            clearInterval(pollInterval);
            return;
        }

        try {
            const res = await fetch(`/runner/api/${APP_NAME}/check_file_status?file_name=${encodeURIComponent(playlist[index].file_name)}`);
            const data = await res.json();
            
            if (data.is_saved) {
                playlist[index].is_saved = true;
                savePlaylist();
                clearInterval(pollInterval);
            }
        } catch (e) {
            console.error("Polling error", e);
        }
    }, 3000);
}

function renderQueue() {
    const list = document.getElementById("queue-list");
    document.getElementById("queue-count").textContent = playlist.length;
    list.innerHTML = "";

    if (playlist.length === 0) {
        list.innerHTML = '<div class="text-xs text-gray-500 text-center py-2">Playlist empty.</div>';
        return;
    }

    playlist.forEach((track, idx) => {
        const isCurrent = idx === currentTrackIndex;
        const item = document.createElement("div");
        item.className = `flex justify-between items-center p-2 rounded text-xs ${isCurrent ? 'bg-green-950 text-green-300 border border-green-800' : 'bg-gray-800/50 text-gray-300'}`;
        
        const statusLabel = track.is_saved 
            ? '<span class="text-[10px] text-green-400">💾 Saved Offline</span>' 
            : '<span class="text-[10px] text-yellow-500 animate-pulse">⏳ Downloading low-data file...</span>';

        item.innerHTML = `
            <div class="truncate cursor-pointer flex-1 mr-2" onclick="playTrack(${idx})">
                <span class="font-bold">${idx + 1}.</span> ${track.title}
                <div class="block">${statusLabel}</div>
            </div>
            <button onclick="deleteTrack(${idx})" class="text-red-400 hover:text-red-300 px-1">✕</button>
        `;
        list.appendChild(item);
    });
}

async function playTrack(index) {
    if (index < 0 || index >= playlist.length) return;

    currentTrackIndex = index;
    const track = playlist[index];
    const status = document.getElementById("player-status");
    const sourceBadge = document.getElementById("playback-source");

    document.getElementById("now-playing-card").classList.remove("hidden");
    document.getElementById("track-title").textContent = track.title;
    document.getElementById("track-artist").textContent = track.artist;
    document.getElementById("track-thumb").src = track.thumbnail;

    // Direct playback using YouTube stream URL (or cached file if saved)
    if (track.stream_url) {
        audioPlayer.src = track.stream_url;
        sourceBadge.textContent = "📡 Streaming Live";
        sourceBadge.className = "text-[10px] px-2 py-1 rounded bg-blue-950 text-blue-300 border border-blue-800";
    }

    audioPlayer.play().catch(e => console.warn("Autoplay blocked:", e));
    status.textContent = "Playing";

    renderQueue();
}

function playNextTrack() {
    if (currentTrackIndex + 1 < playlist.length) {
        playTrack(currentTrackIndex + 1);
    } else {
        document.getElementById("player-status").textContent = "Reached end of playlist.";
    }
}

async function deleteTrack(index) {
    const track = playlist[index];
    
    try {
        await fetch(`/runner/api/${APP_NAME}/delete_local_file?file=${encodeURIComponent(track.file_name)}`);
    } catch (e) {
        console.error("Delete failed", e);
    }

    playlist.splice(index, 1);
    if (currentTrackIndex === index) {
        if (playlist.length > 0) {
            playTrack(Math.min(index, playlist.length - 1));
        } else {
            currentTrackIndex = -1;
            audioPlayer.pause();
            document.getElementById("now-playing-card").classList.add("hidden");
        }
    } else if (currentTrackIndex > index) {
        currentTrackIndex--;
    }
    savePlaylist();
}

// Check status on startup for existing tracks
playlist.forEach((track, idx) => {
    if (!track.is_saved) pollDownloadStatus(idx);
});

renderQueue();
</script>

</body>
</html>
