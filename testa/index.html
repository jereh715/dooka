<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GPS Test</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    background:#0d1117;
    color:white;
    font-family:system-ui;
}
</style>
</head>

<body class="p-6">

<h1 class="text-2xl font-bold mb-4">
📍 Android GPS Location
</h1>

<div class="bg-gray-900 rounded-lg p-4 border border-gray-700">

    <button
        onclick="getLocation()"
        class="bg-blue-600 px-4 py-2 rounded"
    >
        Get Location
    </button>

    <div id="result" class="mt-4 text-sm text-gray-300">
        Waiting...
    </div>

</div>

<script>

const APP_NAME = "gps";

async function getLocation(){

    const result = document.getElementById("result");

    result.innerHTML = "Requesting GPS...";

    try{

        const response =
            await fetch(`/runner/api/${APP_NAME}/get_location`);

        const res = await response.json();

        if(res.success){

            const d = res.data;

            result.innerHTML = `
                Latitude: ${d.latitude}<br>
                Longitude: ${d.longitude}<br>
                Accuracy: ${d.accuracy} m
            `;

        }else{

            result.innerHTML = res.error;

        }

    }catch(err){

        result.innerHTML =
            "Unable to communicate with backend";

    }
}

</script>

</body>
</html>
