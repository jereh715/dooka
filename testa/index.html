<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Location Test</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, sans-serif;
        }
    </style>
</head>

<body class="p-4 flex flex-col min-h-screen">

    <div class="max-w-xl mx-auto w-full">

        <div class="border-b border-gray-800 pb-3 mb-4">
            <h1 class="text-xl font-bold text-white">
                📍 GPS Location Viewer
            </h1>
            <p class="text-xs text-gray-500">
                Android Location via Python Backend
            </p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4">

            <div class="flex justify-between items-center mb-3">
                <h2 class="text-green-400 font-semibold">
                    Current Coordinates
                </h2>

                <button
                    onclick="getLocation()"
                    class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm"
                >
                    Get Location
                </button>
            </div>

            <div id="location-content"
                 class="font-mono text-sm text-gray-300">
                Press "Get Location"
            </div>

        </div>

    </div>

<script>

// Keep using your existing app name
const APP_NAME = "testa";

async function getLocation() {

    const container =
        document.getElementById("location-content");

    container.innerHTML =
        '<span class="text-yellow-400">Requesting GPS...</span>';

    try {

        const response =
            await fetch(`/runner/api/${APP_NAME}/get_location`);

        const res = await response.json();

        if (res.success && res.data) {

            if (res.data.error) {

                container.innerHTML = `
                    <span class="text-red-400">
                        ${res.data.error}
                    </span>
                `;

                return;
            }

            container.innerHTML = `
                <div class="space-y-1">
                    <div>
                        <span class="text-gray-500">Latitude:</span>
                        ${res.data.latitude}
                    </div>

                    <div>
                        <span class="text-gray-500">Longitude:</span>
                        ${res.data.longitude}
                    </div>

                    <div>
                        <span class="text-gray-500">Accuracy:</span>
                        ${res.data.accuracy} m
                    </div>
                </div>
            `;

        } else {

            container.innerHTML = `
                <span class="text-red-400">
                    ${res.error || "Unknown error"}
                </span>
            `;

        }

    } catch (err) {

        container.innerHTML = `
            <span class="text-red-400">
                Failed to contact Python backend.
            </span>
        `;

        console.error(err);
    }
}

</script>

</body>
</html>
