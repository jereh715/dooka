<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumia Price Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 font-sans">

    <!-- App Header -->
    <div class="max-w-md mx-auto space-y-4">
        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
            <h1 class="text-xl font-bold text-orange-500 flex items-center gap-2">
                🛍️ Jumia Scraper
            </h1>
            <span class="text-xs bg-orange-950 text-orange-400 border border-orange-800 px-2 py-0.5 rounded-full font-mono">
                Pure Standard Lib
            </span>
        </div>

        <!-- Search Input Form -->
        <div class="flex gap-2">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search phones, laptops..." 
                value="phones"
                class="flex-1 bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500"
                onkeypress="if(event.key === 'Enter') triggerScrape()"
            />
            <button 
                onclick="triggerScrape()" 
                id="search-btn"
                class="bg-orange-600 hover:bg-orange-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-1">
                Search
            </button>
        </div>

        <!-- Quick Search Tags -->
        <div class="flex gap-2 text-xs overflow-x-auto pb-1">
            <span class="text-gray-500 py-1">Quick:</span>
            <button onclick="setQuery('phones')" class="bg-gray-900 border border-gray-800 px-2 py-1 rounded text-gray-300 hover:border-gray-700">Phones</button>
            <button onclick="setQuery('laptops')" class="bg-gray-900 border border-gray-800 px-2 py-1 rounded text-gray-300 hover:border-gray-700">Laptops</button>
            <button onclick="setQuery('solar')" class="bg-gray-900 border border-gray-800 px-2 py-1 rounded text-gray-300 hover:border-gray-700">Solar</button>
            <button onclick="setQuery('tv')" class="bg-gray-900 border border-gray-800 px-2 py-1 rounded text-gray-300 hover:border-gray-700">TVs</button>
        </div>

        <!-- Status & Results Container -->
        <div id="results-container" class="space-y-2 pt-2">
            <div class="text-center py-8 text-gray-500 text-sm">
                Enter a product name above to scrape live deals from Jumia Kenya.
            </div>
        </div>
    </div>

    <!-- JavaScript Bridge Connection -->
    <script>
        // Extract current app identifier from path or fallback to default
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const APP_NAME = pathSegments[pathSegments.length - 1] || 'sys_diag';

        function setQuery(term) {
            document.getElementById('search-input').value = term;
            triggerScrape();
        }

        async function triggerScrape() {
            const queryInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const container = document.getElementById('results-container');
            const query = queryInput.value.trim();

            if (!query) return;

            // Loading state UI
            searchBtn.disabled = true;
            searchBtn.classList.add('opacity-50');
            container.innerHTML = `
                <div class="p-4 bg-gray-900/50 border border-gray-800 rounded-lg text-center space-y-2">
                    <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-orange-500 border-t-transparent"></div>
                    <p class="text-xs text-gray-400">Sending HTTP request to Jumia Kenya for "<span class="text-white">${query}</span>"...</p>
                </div>
            `;

            try {
                // Dispatch POST request to runner -> script.py -> scrape_jumia
                const response = await fetch(`/runner/api/${APP_NAME}/scrape_jumia`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const result = await response.json();
                
                // Unpack endpoint response structure
                const payload = result.data || result;

                if (payload.success && payload.products && payload.products.length > 0) {
                    container.innerHTML = `
                        <div class="flex justify-between items-center px-1 pb-1 text-xs text-gray-400">
                            <span>Found ${payload.total_found} items</span>
                            <span class="font-mono text-orange-400">Jumia Kenya</span>
                        </div>
                        <div class="space-y-2">
                            ${payload.products.map(item => `
                                <div class="p-3 bg-gray-900 border border-gray-800 rounded-lg flex justify-between items-start gap-3 hover:border-gray-700 transition-colors">
                                    <span class="text-sm text-gray-200 font-medium leading-snug flex-1">${escapeHtml(item.name)}</span>
                                    <span class="text-sm font-bold text-green-400 whitespace-nowrap bg-green-950/40 px-2 py-0.5 rounded border border-green-900/50">
                                        ${escapeHtml(item.price)}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (payload.products && payload.products.length === 0) {
                    container.innerHTML = `
                        <div class="p-4 bg-gray-900 border border-gray-800 rounded-lg text-center text-sm text-gray-400">
                            No products found matching "<span class="text-white">${escapeHtml(query)}</span>".
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="p-4 bg-red-950/30 border border-red-900/50 rounded-lg text-red-400 text-xs font-mono">
                            ⚠️ Error: ${escapeHtml(payload.error || 'Unknown parsing failure')}
                        </div>
                    `;
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="p-4 bg-red-950/30 border border-red-900/50 rounded-lg text-red-400 text-xs font-mono">
                        ⚠️ Network Error: Unable to reach python runner. (${escapeHtml(err.message)})
                    </div>
                `;
            } finally {
                searchBtn.disabled = false;
                searchBtn.classList.remove('opacity-50');
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }
    </script>
</body>
</html>
